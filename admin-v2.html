<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4ead8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Pansi's Daybook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root {
  --font-serif: "Fraunces", "Iowan Old Style", Georgia, serif;
  --font-sans: "Inter", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;

  --ink:      #2b1a10;
  --ink-2:    #6a5240;
  --ink-3:    #a1907c;
  --paper:    #f8f1e0;
  --paper-2:  #fdf7ea;
  --paper-3:  #f2e5c8;
  --edge:     #ead9b8;
  --edge-2:   #f0e3c4;

  --action:      #6a8f4a;
  --action-dark: #4d6d34;
  --highlight:   #dba63f;
  --highlight-2: #f5e2a7;
  --highlight-ink:#7a5a10;
  --night:       #3a3660;
  --night-2:     #ebe6f2;
  --owe:         #c26a4f;
  --owe-2:       #f7e0d6;
  --medical:     #c94a3d;
  --medical-2:   #f9e0dc;

  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-out:    cubic-bezier(0.22, 1, 0.36, 1);
  --dur-fast: 140ms; --dur: 240ms; --dur-slow: 440ms;

  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s7: 32px; --s8: 40px; --s9: 56px; --s10: 72px;
  --r1: 6px; --r2: 10px; --r3: 16px; --r4: 22px;
  --shadow-sm: 0 1px 2px rgba(60,30,10,0.06), 0 1px 3px rgba(60,30,10,0.04);
  --shadow-md: 0 4px 14px rgba(60,30,10,0.08), 0 2px 4px rgba(60,30,10,0.05);
  --shadow-lg: 0 12px 40px rgba(60,30,10,0.14);

  --appbar-h: 60px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; overflow-x: hidden; }
body {
  font-family: var(--font-sans);
  color: var(--ink);
  background: var(--paper);
  background-image:
    radial-gradient(circle at 20% 10%, rgba(219,166,63,0.04) 0, transparent 40%),
    radial-gradient(circle at 80% 90%, rgba(58,54,96,0.03) 0, transparent 40%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.16 0 0 0 0 0.10 0 0 0 0 0.06 0 0 0 0.028 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh; min-height: 100dvh;
  padding-bottom: env(safe-area-inset-bottom);
}
body.modal-open { overflow: hidden; }

/* Type scale */
.t-display   { font-family: var(--font-serif); font-weight: 500; font-size: clamp(30px, 6vw, 44px); line-height: 1.1; letter-spacing: -0.02em; font-variation-settings: 'opsz' 144, 'SOFT' 100; }
.t-headline  { font-family: var(--font-serif); font-weight: 600; font-size: 24px; line-height: 1.15; letter-spacing: -0.01em; font-variation-settings: 'opsz' 144, 'SOFT' 90; }
.t-title     { font-family: var(--font-serif); font-weight: 600; font-size: 18px; line-height: 1.2; font-variation-settings: 'opsz' 144, 'SOFT' 90; }
.t-body      { font-family: var(--font-sans); font-size: 15px; line-height: 1.5; }
.t-caption   { font-family: var(--font-sans); font-size: 12px; line-height: 1.35; color: var(--ink-2); }

/* Login */
#loginScreen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--paper); z-index: 100; }
.login-card { max-width: 380px; width: 92%; padding: var(--s7) var(--s6); text-align: center; }
.login-mark { font-family: var(--font-serif); font-weight: 800; font-size: 46px; color: var(--ink); font-variation-settings: 'opsz' 144, 'SOFT' 100; letter-spacing: -0.02em; margin: 0 0 var(--s2); }
.login-sub { color: var(--ink-2); font-size: 14px; margin: 0 0 var(--s7); font-family: var(--font-serif); font-style: italic; }

.field { width: 100%; padding: 14px var(--s4); margin-bottom: var(--s3); border: 1px solid var(--edge); border-radius: var(--r2); font-size: 16px; font-family: inherit; background: var(--paper-2); color: var(--ink); transition: border-color var(--dur), box-shadow var(--dur); }
.field:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px rgba(43,26,16,0.08); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); padding: 12px var(--s5); border-radius: var(--r2); border: 1px solid transparent; background: var(--paper-2); color: var(--ink); font: 500 15px/1 var(--font-sans); cursor: pointer; transition: transform var(--dur) var(--ease-spring), background var(--dur), box-shadow var(--dur); user-select: none; text-decoration: none; }
.btn:hover { background: var(--paper-3); }
.btn:active { transform: scale(0.97); }
.btn.primary { background: var(--action); color: white; border-color: var(--action-dark); box-shadow: 0 2px 0 var(--action-dark); }
.btn.primary:hover { background: var(--action-dark); }
.btn.primary:active { transform: translateY(1px); box-shadow: 0 0 0 var(--action-dark); }
.btn.ghost { background: transparent; border-color: var(--edge); }
.btn.night { background: var(--night); color: white; border-color: transparent; }
.btn.block { width: 100%; }
.btn.big { padding: 16px var(--s6); font-size: 16px; border-radius: var(--r3); }
.btn.tiny { padding: 6px 10px; font-size: 12px; border-radius: var(--r1); font-weight: 500; }
.btn.danger { color: var(--owe); background: var(--owe-2); border-color: transparent; }

/* App shell */
#app { display: none; min-height: 100vh; min-height: 100dvh; }
.appbar { position: sticky; top: 0; z-index: 20; height: var(--appbar-h); padding: 0 var(--s5); padding-top: env(safe-area-inset-top); display: flex; align-items: center; justify-content: space-between; background: linear-gradient(180deg, var(--paper) 70%, rgba(248,241,224,0)); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.brand { font-family: var(--font-serif); font-weight: 700; font-size: 22px; color: var(--ink); font-variation-settings: 'opsz' 144, 'SOFT' 100; letter-spacing: -0.01em; cursor: pointer; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--night); color: white; display: flex; align-items: center; justify-content: center; font-family: var(--font-serif); font-weight: 700; font-size: 16px; cursor: pointer; transition: transform var(--dur) var(--ease-spring); border: 2px solid var(--paper); box-shadow: var(--shadow-sm); }
.avatar:active { transform: scale(0.94); }

#surface { padding: var(--s3) var(--s5) 110px; max-width: 720px; margin: 0 auto; }
@media (min-width: 900px) { #surface { max-width: 960px; padding-bottom: var(--s9); } }

/* Tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px var(--s3) calc(8px + env(safe-area-inset-bottom)); background: rgba(248,241,224,0.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--edge); display: flex; justify-content: space-around; z-index: 15; }
.tab { flex: 1; padding: 8px 4px; background: transparent; border: 0; font: 500 11px/1.2 var(--font-sans); color: var(--ink-3); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: color var(--dur); border-radius: var(--r2); letter-spacing: 0.08em; }
.tab-ico { font-family: var(--font-serif); font-weight: 600; font-size: 20px; font-variation-settings: 'opsz' 144, 'SOFT' 100; color: var(--ink-3); line-height: 1; transition: color var(--dur), transform var(--dur) var(--ease-spring); }
.tab.active, .tab.active .tab-ico { color: var(--ink); }
.tab.active .tab-ico { transform: translateY(-1px); }
.tab:active .tab-ico { transform: scale(0.9); }

/* Shared */
.greet { font-family: var(--font-serif); font-weight: 500; font-size: clamp(28px, 6vw, 40px); color: var(--ink); line-height: 1.1; letter-spacing: -0.02em; margin: var(--s5) 0 var(--s2); font-variation-settings: 'opsz' 144, 'SOFT' 100; }
.greet em { font-style: italic; color: var(--ink-2); }
.sub { color: var(--ink-2); font-size: 15px; margin: 0 0 var(--s6); line-height: 1.5; }
.sub.tight { margin-bottom: var(--s3); }
.section-title { font-family: var(--font-serif); font-weight: 600; font-size: 15px; color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.12em; margin: var(--s7) 0 var(--s3); display: flex; align-items: center; gap: var(--s3); }
.section-title::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--edge) 0%, transparent 100%); }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; background: var(--paper-3); color: var(--ink-2); }
.pill.night { background: var(--night-2); color: var(--night); }
.pill.owe { background: var(--owe-2); color: var(--owe); }
.pill.med { background: var(--medical-2); color: var(--medical); font-weight: 600; }
.pill.hi { background: var(--highlight-2); color: var(--highlight-ink); }
.pill.done { background: var(--action); color: white; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; font-size: 14px; font-weight: 500; background: var(--paper-2); border: 1.5px solid var(--edge); cursor: pointer; transition: all var(--dur) var(--ease-spring); color: var(--ink); user-select: none; -webkit-tap-highlight-color: transparent; }
.chip:hover { border-color: var(--ink-3); }
.chip.on { background: var(--action); color: white; border-color: var(--action-dark); transform: scale(1.02); box-shadow: 0 2px 6px rgba(106,143,74,0.28); }

/* Day */
.day-empty { text-align: center; padding: var(--s10) var(--s5); color: var(--ink-2); font-family: var(--font-serif); font-size: 22px; font-style: italic; font-variation-settings: 'opsz' 144, 'SOFT' 100; }

.stay-strip { background: linear-gradient(135deg, var(--night) 0%, #4a4276 100%); color: white; border-radius: var(--r4); padding: var(--s5); margin-bottom: var(--s5); position: relative; overflow: hidden; box-shadow: var(--shadow-md); }
.stay-strip::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 88% 22%, rgba(255,255,255,0.25) 0, transparent 4px), radial-gradient(circle at 12% 78%, rgba(255,255,255,0.18) 0, transparent 3px), radial-gradient(circle at 60% 88%, rgba(255,255,255,0.15) 0, transparent 3px), radial-gradient(circle at 78% 62%, rgba(255,255,255,0.12) 0, transparent 2px); pointer-events: none; }
.stay-strip-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.15em; opacity: 0.75; font-weight: 600; margin-bottom: var(--s2); }
.stay-strip-list { display: flex; flex-direction: column; gap: var(--s2); position: relative; }
.stay-item { display: flex; align-items: center; gap: var(--s3); padding: var(--s3) 0; border-top: 1px solid rgba(255,255,255,0.12); }
.stay-item:first-child { border-top: 0; }
.stay-face { width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center; font-size: 22px; overflow: hidden; flex-shrink: 0; }
.stay-face img { width: 100%; height: 100%; object-fit: cover; }
.stay-body { flex: 1; min-width: 0; }
.stay-name { font-family: var(--font-serif); font-weight: 600; font-size: 20px; letter-spacing: -0.01em; }
.stay-meta { font-size: 12px; opacity: 0.75; margin-top: 2px; }
.stay-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.stay-actions .btn { background: rgba(255,255,255,0.14); color: white; border-color: transparent; padding: 6px 12px; font-size: 12px; }
.stay-actions .btn:hover { background: rgba(255,255,255,0.24); }

.dog-card { background: var(--paper-2); border-radius: var(--r4); padding: var(--s5); margin-bottom: var(--s3); border: 1px solid var(--edge-2); box-shadow: var(--shadow-sm); position: relative; overflow: hidden; transition: transform var(--dur) var(--ease-spring), box-shadow var(--dur), background var(--dur); }
.dog-card:hover { box-shadow: var(--shadow-md); }
.dog-card.in-care { background: linear-gradient(180deg, #ecf1e2 0%, var(--paper-2) 40%); border-color: #cddab6; }
.dog-card.done { opacity: 0.55; }

.swipe-wrap { position: relative; margin-bottom: var(--s3); border-radius: var(--r4); }
.swipe-plate { position: absolute; inset: 0; border-radius: var(--r4); background: linear-gradient(90deg, var(--action) 0%, var(--action-dark) 100%); color: white; display: flex; align-items: center; padding: 0 var(--s5); font-weight: 600; font-size: 15px; overflow: hidden; }
.swipe-plate .paw { font-size: 24px; margin-right: 10px; }
.swipe-wrap > .dog-card { transition: transform var(--dur) var(--ease-out); touch-action: pan-y; margin-bottom: 0; }
.swipe-wrap.swiping > .dog-card { transition: none; }
.paw-stamp { position: absolute; top: 50%; right: 32px; transform: translate(30px, -50%) rotate(-15deg) scale(0); font-size: 44px; opacity: 0; pointer-events: none; transition: transform 300ms var(--ease-spring), opacity 200ms; }
.paw-stamp.on { transform: translate(0, -50%) rotate(-15deg) scale(1); opacity: 1; }

.dog-card-top { display: flex; align-items: center; gap: var(--s4); margin-bottom: var(--s3); }
.dog-face { width: 56px; height: 56px; border-radius: 50%; background: var(--paper-3); display: flex; align-items: center; justify-content: center; font-size: 30px; flex-shrink: 0; border: 2px solid var(--paper-2); box-shadow: inset 0 0 0 1px var(--edge); overflow: hidden; }
.dog-face img { width: 100%; height: 100%; object-fit: cover; }
.dog-face.night { background: var(--night-2); box-shadow: inset 0 0 0 1px var(--night); }
.dog-name { font-family: var(--font-serif); font-variation-settings: 'opsz' 144, 'SOFT' 90; font-weight: 600; font-size: 26px; color: var(--ink); line-height: 1.1; letter-spacing: -0.01em; }
.dog-sub { color: var(--ink-2); font-size: 13px; margin-top: 2px; }
.dog-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

.dog-card-actions { display: flex; gap: var(--s2); flex-wrap: wrap; }
.dog-card-actions .btn.primary { flex: 1; min-width: 140px; }
.dog-card .primary-icon { width: 22px; height: 22px; border-radius: 50%; background: rgba(255,255,255,0.22); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; margin-right: 4px; }
.dog-card .quick-photos { display: flex; gap: 6px; margin-top: 10px; align-items: center; overflow-x: auto; padding-bottom: 4px; }
.dog-card .quick-photo { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; border: 1.5px solid var(--edge); flex-shrink: 0; }
.dog-card .quick-add-photo { width: 44px; height: 44px; border-radius: 8px; background: var(--paper-3); border: 1.5px dashed var(--edge); display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--ink-3); cursor: pointer; flex-shrink: 0; }
.timestamp { font-size: 12px; color: var(--action-dark); font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }

/* Week */
.week-day { background: var(--paper-2); border-radius: var(--r3); margin-bottom: var(--s3); padding: var(--s4) var(--s5); border: 1px solid var(--edge-2); transition: background var(--dur); }
.week-day.today { background: linear-gradient(180deg, #fff8e3 0%, var(--paper-2) 40%); border-color: var(--highlight-2); }
.week-day.past { opacity: 0.55; }
.week-day.empty { padding: var(--s3) var(--s5); background: transparent; border: 1px dashed var(--edge); color: var(--ink-3); font-style: italic; display: flex; justify-content: space-between; align-items: center; font-size: 13px; cursor: pointer; }
.week-day.empty:hover { border-color: var(--ink-2); color: var(--ink-2); }
.week-day-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: var(--s3); flex-wrap: wrap; gap: 6px; }
.week-day-name { font-family: var(--font-serif); font-weight: 600; font-size: 20px; color: var(--ink); letter-spacing: -0.01em; }
.week-day-name .dow { color: var(--ink-3); font-weight: 400; margin-left: 8px; }
.week-day-cap { font-size: 12px; color: var(--ink-2); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.cap-bar { display: inline-block; width: 40px; height: 5px; background: var(--edge); border-radius: 3px; overflow: hidden; vertical-align: middle; margin-left: 4px; }
.cap-bar > span { display: block; height: 100%; background: var(--action); border-radius: 3px; transition: width var(--dur); }
.cap-bar > span.night { background: var(--night); }
.cap-bar > span.full { background: var(--highlight); }
.week-day .revenue { color: var(--ink); font-family: var(--font-serif); font-weight: 500; }
.day-revenue { font-family: var(--font-serif); font-weight: 600; font-size: 18px; color: var(--ink); letter-spacing: -0.01em; }
.day-revenue .paid-hint { font-size: 11px; color: var(--ink-3); font-weight: 400; letter-spacing: 0; }
.day-add { width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: var(--paper); border: 0; font-size: 15px; line-height: 1; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: transform var(--dur) var(--ease-spring); }
.day-add:hover { transform: scale(1.1); }
.day-add:active { transform: scale(0.9); }

/* Week grouping header */
.week-header { display: flex; justify-content: space-between; align-items: baseline; padding: var(--s5) 0 var(--s3); margin-top: var(--s3); border-bottom: 1px solid var(--edge); font-family: var(--font-serif); font-weight: 600; font-size: 20px; color: var(--ink); letter-spacing: -0.01em; font-variation-settings: 'opsz' 144, 'SOFT' 90; }
.week-header:first-of-type { margin-top: var(--s2); padding-top: var(--s3); }
.week-total { font-family: var(--font-serif); font-size: 16px; color: var(--ink); font-weight: 500; }
.week-total b { font-weight: 700; }
.week-total .muted { color: var(--ink-3); font-size: 13px; font-weight: 400; }

/* Week mode switch (upcoming / history) */
.week-mode-switch { display: inline-flex; background: var(--paper-2); border: 1px solid var(--edge); border-radius: 999px; padding: 3px; margin: 0 0 var(--s5); gap: 3px; }
.week-mode-btn { padding: 8px 16px; background: transparent; border: 0; border-radius: 999px; font: 500 13px var(--font-sans); color: var(--ink-2); cursor: pointer; transition: all var(--dur); }
.week-mode-btn.on { background: var(--ink); color: var(--paper); }
.week-dog-row { display: flex; align-items: center; gap: var(--s3); padding: 8px; margin: 0 -8px; border-top: 1px dashed var(--edge-2); cursor: pointer; transition: background var(--dur); border-radius: 6px; }
.week-dog-row:first-of-type { border-top: 0; }
.week-dog-row:hover { background: var(--paper-3); }
.week-dog-face { width: 34px; height: 34px; border-radius: 50%; background: var(--paper-3); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; border: 1.5px solid var(--edge); overflow: hidden; }
.week-dog-face img { width: 100%; height: 100%; object-fit: cover; }
.week-dog-face.night { background: var(--night-2); border-color: var(--night); }
.week-dog-body { flex: 1; min-width: 0; }
.week-dog-name { font-family: var(--font-serif); font-weight: 600; font-size: 15px; color: var(--ink); }
.week-dog-meta { font-size: 12px; color: var(--ink-2); }
/* Today — one plain list of who's on */
.today-count { font-size: 13px; color: var(--ink-2); margin: 0 0 14px; }
.today-row.cancelled .today-name, .today-row.cancelled .today-meta { text-decoration: line-through; opacity: 0.55; }
.week-dog-row.cancelled .week-dog-name, .week-dog-row.cancelled .week-dog-price { text-decoration: line-through; opacity: 0.55; }
.row-cancel { font-size: 12px; color: var(--owe); }
.recon-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 12px; align-items: center;
  padding: 10px 0; border-bottom: 1px solid var(--edge-2); }
.recon-row.done { opacity: 0.5; }
.recon-desc { font-size: 13px; color: var(--ink); word-break: break-word; }
.recon-meta { font-size: 11px; color: var(--ink-2); margin-top: 2px; }
.recon-match { padding: 6px 8px; border-radius: var(--r1); background: var(--kraft); }
.recon-match.strong { background: #e8f0e0; }
.recon-name { font-family: var(--font-serif); font-size: 14px; color: var(--ink); }
@media (max-width: 560px) { .recon-row { grid-template-columns: 1fr; } }
.today-warn { background: #fdf3e7; color: #a8621f; font-size: 13px; line-height: 1.5;
  padding: 10px 12px; border-radius: var(--r2); margin-bottom: 14px; }
.today-list { border-top: 1px solid var(--edge-2); }
.today-row { display: flex; align-items: center; gap: 12px; padding: 12px 4px;
  border-bottom: 1px solid var(--edge-2); }
.today-row.dupe { background: #fdf3e7; }
.today-face { width: 38px; height: 38px; border-radius: 50%; overflow: hidden; flex-shrink: 0;
  background: var(--kraft); display: flex; align-items: center; justify-content: center; cursor: pointer; }
.today-face.night { box-shadow: 0 0 0 2px var(--night); }
.today-face img { width: 100%; height: 100%; object-fit: cover; }
.today-body { flex: 1; min-width: 0; cursor: pointer; }
.today-name { font-family: var(--font-serif); font-size: 16px; font-weight: 500; color: var(--ink); }
.today-meta { font-size: 12px; color: var(--ink-2); margin-top: 1px; }
.today-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.row-here { font-size: 12px; color: var(--action-dark); }
.row-done { font-size: 12px; color: var(--ink-3); }
.week-dog-price { font-family: var(--font-serif); font-weight: 500; font-size: 15px; color: var(--ink); font-variant-numeric: tabular-nums; margin-left: auto; flex-shrink: 0; }
.week-dog-row.orphan { background: #fdf3e7; }
.week-dog-row.orphan .week-dog-face { background: var(--edge); color: var(--ink-2); display: flex; align-items: center; justify-content: center; font-weight: 700; }
.week-dog-row.orphan .week-dog-meta { color: #a8621f; }
/* Receipt foot — the rows above literally add up to this. */
.day-total { display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
  margin: 10px -8px 0; padding: 10px 8px 0; border-top: 1.5px solid var(--ink); }
.day-total .dt-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-2); }
.day-total .dt-amt { font-family: var(--font-serif); font-weight: 600; font-size: 20px; color: var(--ink);
  letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.week-dog-price { font-family: var(--font-serif); font-weight: 500; color: var(--ink); font-size: 14px; }

.stay-ribbon { display: flex; align-items: center; gap: var(--s3); padding: 10px 12px; background: linear-gradient(135deg, var(--night) 0%, #4a4276 100%); color: white; border-radius: var(--r2); margin: 4px 0; cursor: pointer; }
.stay-ribbon .stay-face { width: 34px; height: 34px; background: rgba(255,255,255,0.15); }
.stay-ribbon .body { flex: 1; }
.stay-ribbon .body .name { font-family: var(--font-serif); font-weight: 600; font-size: 15px; }
.stay-ribbon .body .meta { font-size: 12px; opacity: 0.8; }
.stay-ribbon .amount { font-family: var(--font-serif); font-weight: 500; font-size: 15px; }

/* Pack */
.search-bar { position: sticky; top: var(--appbar-h); z-index: 5; background: var(--paper); padding: var(--s3) 0; }
.search-input { width: 100%; padding: 12px var(--s5); border: 1px solid var(--edge); border-radius: 999px; font-size: 15px; background: var(--paper-2); font-family: inherit; transition: border-color var(--dur), box-shadow var(--dur); }
.search-input:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px rgba(43,26,16,0.08); }
.pack-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: var(--s3); }
.pack-card { background: var(--paper-2); border-radius: var(--r3); padding: var(--s4) var(--s3) var(--s3); border: 1px solid var(--edge-2); text-align: center; cursor: pointer; transition: transform var(--dur) var(--ease-spring), box-shadow var(--dur); box-shadow: var(--shadow-sm); }
.pack-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.pack-face { width: 68px; height: 68px; border-radius: 50%; background: var(--paper-3); margin: 0 auto var(--s3); display: flex; align-items: center; justify-content: center; font-size: 34px; border: 2px solid var(--paper-2); box-shadow: inset 0 0 0 1px var(--edge); overflow: hidden; }
.pack-face img { width: 100%; height: 100%; object-fit: cover; }
.pack-name { font-family: var(--font-serif); font-weight: 600; font-size: 18px; color: var(--ink); letter-spacing: -0.01em; font-variation-settings: 'opsz' 144, 'SOFT' 90; }
.pack-owner { font-size: 12px; color: var(--ink-2); margin-top: 2px; }
.pack-tag { font-size: 11px; color: var(--ink-3); margin-top: 6px; text-transform: uppercase; letter-spacing: 0.08em; }
.pack-tag.med { color: var(--medical); font-weight: 600; }
.pack-actions { text-align: center; margin: var(--s5) 0; display: flex; gap: var(--s3); justify-content: center; flex-wrap: wrap; }

/* Ledger */
.ledger-hero { padding: var(--s6) var(--s5); background: linear-gradient(180deg, var(--paper-3) 0%, transparent 100%); border-radius: var(--r4); margin-bottom: var(--s5); text-align: center; }
.ledger-num { font-family: var(--font-serif); font-variation-settings: 'opsz' 144, 'SOFT' 80; font-weight: 700; font-size: clamp(48px, 12vw, 72px); color: var(--ink); letter-spacing: -0.03em; line-height: 1; }
.ledger-caption { color: var(--ink-2); font-family: var(--font-serif); font-style: italic; margin-top: var(--s3); font-size: 15px; }
.ledger-delta.up { color: var(--action-dark); font-weight: 600; }
.ledger-delta.down { color: var(--owe); font-weight: 600; }
.ledger-sub { display: flex; gap: var(--s5); justify-content: center; flex-wrap: wrap; margin-top: var(--s4); font-size: 13px; color: var(--ink-2); }
.ledger-sub b { font-family: var(--font-serif); font-weight: 600; color: var(--ink); }
.ledger-row { display: flex; align-items: center; justify-content: space-between; padding: var(--s3) var(--s4); background: var(--paper-2); border-radius: var(--r2); margin-bottom: var(--s2); border: 1px solid var(--edge-2); cursor: pointer; transition: background var(--dur); }
.ledger-row:hover { background: var(--paper-3); }
.ledger-row .r-dog { font-family: var(--font-serif); font-weight: 600; font-size: 16px; }
.ledger-row .r-date { font-size: 12px; color: var(--ink-2); margin-top: 2px; }
.ledger-row .r-amt { font-family: var(--font-serif); font-weight: 600; font-size: 18px; color: var(--ink); }
.ledger-row .r-amt.owe { color: var(--owe); }

/* Period switcher */
.period-switch { display: inline-flex; background: var(--paper-2); border: 1px solid var(--edge); border-radius: 999px; padding: 3px; margin: 0 0 var(--s5); gap: 3px; }
.period-btn { padding: 6px 14px; background: transparent; border: 0; border-radius: 999px; font: 500 13px var(--font-sans); color: var(--ink-2); cursor: pointer; transition: all var(--dur); }
.period-btn.on { background: var(--ink); color: var(--paper); }

/* Trend chart */
.trend-chart { display: flex; align-items: flex-end; gap: 8px; height: 140px; padding: var(--s4) var(--s3) 30px; background: var(--paper-2); border: 1px solid var(--edge-2); border-radius: var(--r3); position: relative; }
.trend-bar { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; position: relative; }
.trend-fill { width: 100%; max-width: 40px; background: linear-gradient(180deg, var(--action-dark), var(--action)); border-radius: 6px 6px 0 0; min-height: 4px; transition: height var(--dur-slow) var(--ease-out); }
.trend-bar.current .trend-fill { background: linear-gradient(180deg, var(--highlight), #b8862a); }
.trend-label { position: absolute; bottom: -22px; font-size: 11px; color: var(--ink-2); font-weight: 500; }
.trend-value { position: absolute; top: -18px; font-size: 10px; color: var(--ink-3); font-family: var(--font-serif); font-weight: 500; white-space: nowrap; }

/* Service split */
.split-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3); margin-bottom: var(--s3); }
.split-item { background: var(--paper-2); border: 1px solid var(--edge-2); border-radius: var(--r3); padding: var(--s4); }
.split-num { font-family: var(--font-serif); font-weight: 700; font-size: 26px; color: var(--ink); letter-spacing: -0.02em; font-variation-settings: 'opsz' 144, 'SOFT' 80; }
.split-label { font-size: 12px; color: var(--ink-2); margin-top: 4px; }
.split-bar { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--edge); }
.split-day { background: var(--action); }
.split-night { background: var(--night); }

/* Occupancy */
.occupancy-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3); }
.occupancy-item { background: var(--paper-2); border: 1px solid var(--edge-2); border-radius: var(--r3); padding: var(--s4); }
.occupancy-num { font-family: var(--font-serif); font-weight: 700; font-size: 36px; color: var(--ink); letter-spacing: -0.02em; line-height: 1; font-variation-settings: 'opsz' 144, 'SOFT' 80; }
.occupancy-num .pct { font-size: 18px; color: var(--ink-2); font-weight: 500; margin-left: 2px; }
.occupancy-label { font-size: 12px; color: var(--ink-2); margin: 6px 0 10px; }

/* Aging */
.aging-alert { background: var(--owe-2); color: var(--owe); padding: 10px var(--s4); border-radius: var(--r2); font-size: 13px; font-weight: 600; margin-bottom: var(--s3); border-left: 3px solid var(--owe); }
.aging-alert.soft { background: var(--highlight-2); color: var(--highlight-ink); border-left-color: var(--highlight); }
.age-pill { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 10px; font-weight: 600; background: var(--paper-3); color: var(--ink-2); margin-left: 4px; }
.age-pill.age-warn { background: var(--highlight-2); color: var(--highlight-ink); }
.age-pill.age-bad { background: var(--owe-2); color: var(--owe); }

/* Booking price preview */
.price-preview { background: linear-gradient(135deg, var(--ink) 0%, #3a2418 100%); color: var(--paper); border-radius: var(--r3); padding: var(--s4) var(--s5); margin-bottom: var(--s4); text-align: center; }
.price-preview-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; opacity: 0.7; }
.price-preview-num { font-family: var(--font-serif); font-weight: 700; font-size: 40px; letter-spacing: -0.02em; margin: 4px 0; font-variation-settings: 'opsz' 144, 'SOFT' 80; line-height: 1; }
.price-preview-breakdown { font-size: 12px; opacity: 0.75; font-style: italic; }

/* Repeat booking */
.repeat-group { background: var(--paper-2); border: 1px dashed var(--edge); border-radius: var(--r2); padding: var(--s3) var(--s4); }
.repeat-body { padding-top: 8px; }
.repeat-preview { background: var(--paper-3); padding: 8px 12px; border-radius: var(--r1); margin-top: 8px; color: var(--ink); }
.repeat-preview b { color: var(--ink); font-weight: 700; }

/* Welcome packs */
.pack-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: var(--paper-2); border-radius: var(--r2); margin-bottom: 8px; border: 1px solid var(--edge-2); border-left: 4px solid var(--highlight); }
.pack-row.expired { opacity: 0.55; border-left-color: var(--ink-3); }
.pack-row.used { border-left-color: var(--action); }
.pack-row-title { font-family: var(--font-serif); font-weight: 600; font-size: 15px; color: var(--ink); }
.pack-row-meta { font-size: 12px; color: var(--ink-2); margin-top: 2px; }
.pack-row-amt { font-family: var(--font-serif); font-weight: 600; font-size: 16px; color: var(--ink); }
.pack-row-wrap { margin-bottom: 12px; }
.pack-dots { display: flex; gap: 4px; margin-top: 8px; }
.pack-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--edge); border: 1.5px solid var(--edge); }
.pack-dot.used { background: var(--highlight); border-color: var(--highlight); }
.pack-log { padding: 8px 12px; background: var(--paper); border-radius: 0 0 var(--r2) var(--r2); margin-top: -8px; border: 1px solid var(--edge-2); border-top: 0; }
.pack-log-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px; color: var(--ink); cursor: pointer; border-bottom: 1px dashed var(--edge-2); }
.pack-log-row:last-child { border-bottom: 0; }
.pack-log-row:hover { color: var(--action-dark); }
.pack-log-empty { padding: 8px 12px; background: var(--paper); border-radius: 0 0 var(--r2) var(--r2); margin-top: -8px; border: 1px solid var(--edge-2); border-top: 0; font-size: 12px; color: var(--ink-3); font-style: italic; }

.pack-option { border: 1.5px solid var(--edge); border-radius: var(--r2); padding: var(--s4); background: var(--paper-2); text-align: center; transition: all var(--dur); }
.pack-option.on { border-color: var(--highlight); background: linear-gradient(180deg, #fff8e3 0%, var(--paper-2) 60%); box-shadow: 0 2px 8px rgba(219,166,63,0.15); }
.pack-option-tier { font-family: var(--font-serif); font-weight: 600; font-size: 15px; color: var(--ink); margin-bottom: 6px; }
.pack-option-price { font-family: var(--font-serif); font-weight: 700; font-size: 26px; color: var(--ink); letter-spacing: -0.02em; }
.pack-option-unit { font-size: 11px; color: var(--ink-2); margin-top: 4px; }

.pack-toggle { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--night-2); border: 1.5px solid var(--night); border-radius: var(--r2); cursor: pointer; transition: all var(--dur); }
.pack-toggle.on { background: var(--night); color: white; }
.pack-toggle.on .pack-toggle-meta { color: rgba(255,255,255,0.75); }
.pack-toggle input { width: 18px; height: 18px; accent-color: var(--night); }
.pack-toggle-title { font-family: var(--font-serif); font-weight: 600; font-size: 15px; }
.pack-toggle-meta { font-size: 12px; color: var(--night); margin-top: 2px; }

@media (max-width: 480px) {
  .split-row, .occupancy-row { grid-template-columns: 1fr; }
  .trend-chart { height: 120px; }
  .trend-bar .trend-value { font-size: 9px; }
}

/* Sheet */
#modalHost { position: fixed; inset: 0; display: none; z-index: 40; align-items: flex-end; justify-content: center; }
#modalHost.on { display: flex; }
.sheet-backdrop { position: absolute; inset: 0; background: rgba(43,26,16,0.42); animation: fadeIn var(--dur) var(--ease-out); }
.sheet { position: relative; width: 100%; max-width: 560px; background: var(--paper); border-radius: var(--r4) var(--r4) 0 0; padding: var(--s6) var(--s5) calc(var(--s6) + env(safe-area-inset-bottom)); max-height: 92vh; overflow-y: auto; animation: slideUp var(--dur-slow) var(--ease-spring); box-shadow: var(--shadow-lg); }
.sheet-handle { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: 40px; height: 4px; background: var(--edge); border-radius: 2px; }
.sheet-title { font-family: var(--font-serif); font-variation-settings: 'opsz' 144, 'SOFT' 100; font-weight: 600; font-size: 26px; color: var(--ink); letter-spacing: -0.01em; margin: var(--s3) 0 var(--s2); }
.sheet-sub { color: var(--ink-2); font-size: 14px; margin: 0 0 var(--s5); }
.sheet-close { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border-radius: 50%; background: var(--paper-2); border: 1px solid var(--edge); font-size: 20px; color: var(--ink-2); cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1; }

.field-group { margin-bottom: var(--s4); }
.field-group label { display: block; font-size: 13px; color: var(--ink-2); margin-bottom: 6px; font-weight: 500; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3); }
.field select, .field textarea { font-family: inherit; }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { transform: translateY(24px); opacity: 0.6; } to { transform: translateY(0); opacity: 1; } }
@keyframes pop { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

/* Ritual */
.ritual-overlay { position: fixed; inset: 0; background: var(--paper); z-index: 60; display: none; flex-direction: column; animation: fadeIn var(--dur) var(--ease-out); }
.ritual-overlay.on { display: flex; }
.ritual-head { padding: var(--s5); padding-top: max(var(--s5), env(safe-area-inset-top)); display: flex; justify-content: space-between; align-items: center; }
.ritual-progress { font-family: var(--font-serif); font-size: 15px; color: var(--ink-2); font-variation-settings: 'opsz' 144, 'SOFT' 100; }
.ritual-progress b { color: var(--ink); font-weight: 700; }
.ritual-close { background: transparent; border: 0; color: var(--ink-2); font-size: 24px; cursor: pointer; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; }
.ritual-body { flex: 1; overflow-y: auto; padding: 0 var(--s5) var(--s5); max-width: 640px; margin: 0 auto; width: 100%; }
.ritual-hero { display: flex; align-items: center; gap: var(--s4); padding: var(--s4) 0 var(--s5); }
.ritual-hero-face { width: 80px; height: 80px; border-radius: 50%; background: var(--paper-3); display: flex; align-items: center; justify-content: center; font-size: 42px; border: 3px solid var(--paper-2); box-shadow: inset 0 0 0 1px var(--edge), var(--shadow-sm); overflow: hidden; }
.ritual-hero-face img { width: 100%; height: 100%; object-fit: cover; }
.ritual-hero-name { font-family: var(--font-serif); font-weight: 700; font-variation-settings: 'opsz' 144, 'SOFT' 90; font-size: 36px; letter-spacing: -0.02em; line-height: 1; }
.ritual-hero-meta { color: var(--ink-2); font-size: 14px; margin-top: 4px; }
.ritual-question { font-family: var(--font-serif); font-weight: 500; font-size: 18px; color: var(--ink); margin: var(--s5) 0 var(--s3); font-variation-settings: 'opsz' 144, 'SOFT' 100; }
.chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: var(--s4); }
.ritual-notes { width: 100%; padding: var(--s4); border: 1.5px solid var(--edge); border-radius: var(--r3); font-family: inherit; font-size: 15px; min-height: 90px; resize: vertical; background: var(--paper-2); color: var(--ink); }
.ritual-notes:focus { outline: none; border-color: var(--ink); }
.ritual-photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; margin-bottom: var(--s4); }
.ritual-photo-slot { aspect-ratio: 1; border-radius: var(--r2); background: var(--paper-3); overflow: hidden; position: relative; }
.ritual-photo-slot img { width: 100%; height: 100%; object-fit: cover; }
.ritual-photo-slot.add { border: 1.5px dashed var(--edge); display: flex; align-items: center; justify-content: center; font-size: 28px; color: var(--ink-3); cursor: pointer; }
.ritual-photo-slot.add:hover { border-color: var(--ink); color: var(--ink); }
.ritual-photo-slot .rm { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%; background: rgba(0,0,0,0.6); color: white; border: 0; cursor: pointer; font-size: 12px; }
.ritual-foot { padding: var(--s4) var(--s5); padding-bottom: calc(var(--s4) + env(safe-area-inset-bottom)); border-top: 1px solid var(--edge); display: flex; gap: var(--s3); background: var(--paper); }
.ritual-foot .btn { flex: 1; }

/* Day Close scrapbook */
.close-page { padding: var(--s6) var(--s5); text-align: center; animation: pop var(--dur-slow) var(--ease-spring); max-width: 640px; margin: 0 auto; }
.close-headline { font-family: var(--font-serif); font-weight: 500; font-style: italic; font-size: clamp(28px, 6vw, 40px); color: var(--ink); letter-spacing: -0.02em; line-height: 1.2; margin-bottom: var(--s4); font-variation-settings: 'opsz' 144, 'SOFT' 100; }
.close-collage { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 6px; margin: var(--s5) 0; }
.close-thumb { aspect-ratio: 1; border-radius: var(--r2); overflow: hidden; background: var(--paper-3); border: 2px solid var(--paper); box-shadow: var(--shadow-sm); position: relative; }
.close-thumb:nth-child(3n) { transform: rotate(-1deg); }
.close-thumb:nth-child(3n+1) { transform: rotate(1deg); }
.close-thumb img { width: 100%; height: 100%; object-fit: cover; }
.close-thumb .caption { position: absolute; bottom: 0; left: 0; right: 0; padding: 3px 6px; background: linear-gradient(0deg, rgba(0,0,0,0.65), transparent); color: white; font-size: 10px; font-weight: 600; text-align: left; }
.close-mood { font-family: var(--font-serif); font-size: 18px; font-style: italic; color: var(--ink-2); margin: var(--s4) 0; font-variation-settings: 'opsz' 144, 'SOFT' 100; }
.close-stats { display: flex; gap: var(--s5); justify-content: center; margin: var(--s5) 0; flex-wrap: wrap; }
.close-stat { padding: var(--s3) var(--s5); background: var(--paper-2); border-radius: 999px; border: 1px solid var(--edge); font-family: var(--font-serif); font-size: 15px; color: var(--ink); }
.close-stat b { font-weight: 700; font-size: 18px; }

/* Report preview (client-facing) */
.report-preview { background: white; border-radius: var(--r3); overflow: hidden; box-shadow: var(--shadow-md); border: 1px solid var(--edge); max-width: 380px; margin: var(--s3) auto; }
.report-preview .rp-photo { width: 100%; aspect-ratio: 4/3; background: var(--paper-3); display: flex; align-items: center; justify-content: center; color: var(--ink-3); font-size: 48px; overflow: hidden; }
.report-preview .rp-photo img { width: 100%; height: 100%; object-fit: cover; }
.report-preview .rp-body { padding: var(--s5); text-align: center; }
.report-preview .rp-name { font-family: var(--font-serif); font-weight: 700; font-size: 30px; letter-spacing: -0.02em; color: var(--ink); font-variation-settings: 'opsz' 144, 'SOFT' 90; }
.report-preview .rp-mood { font-family: var(--font-serif); font-style: italic; font-size: 16px; color: var(--ink-2); margin: 6px 0 var(--s3); }
.report-preview .rp-story { background: var(--paper); padding: var(--s3); border-radius: var(--r2); font-size: 13px; line-height: 1.5; text-align: left; margin-bottom: var(--s3); color: var(--ink); border-left: 3px solid var(--highlight); }
.report-preview .rp-moments { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin-bottom: var(--s3); }
.report-preview .rp-moment { padding: 4px 10px; background: var(--highlight-2); color: var(--highlight-ink); border-radius: 999px; font-size: 11px; font-weight: 500; }
.report-preview .rp-foot { padding: var(--s2) var(--s5) var(--s3); border-top: 1px dashed var(--edge); font-size: 10px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.15em; text-align: center; }

/* Toast */
#toast-host { position: fixed; bottom: calc(90px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); z-index: 80; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
.toast { background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 500; animation: slideUp var(--dur) var(--ease-spring), fadeOut 300ms 2.4s forwards; box-shadow: var(--shadow-md); }
.toast.warn { background: var(--owe); color: white; font-weight: 600; }
@keyframes fadeOut { to { opacity: 0; transform: translateY(-10px); } }

/* Persistent sync-failure banner — impossible to miss */
#sync-banner { position: fixed; top: 0; left: 0; right: 0; z-index: 200; background: var(--owe); color: white; padding: 10px var(--s5); font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; gap: var(--s3); box-shadow: 0 2px 8px rgba(60,30,10,0.2); padding-top: max(10px, env(safe-area-inset-top)); }
#sync-banner .msg { flex: 1; min-width: 0; }
#sync-banner button { background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.4); padding: 6px 14px; border-radius: var(--r1); font: 600 13px var(--font-sans); cursor: pointer; }
#sync-banner button:hover { background: rgba(255,255,255,0.3); }

/* Avatar menu */
.avatar-menu { position: absolute; top: calc(var(--appbar-h) + 4px); right: var(--s5); background: var(--paper); border: 1px solid var(--edge); border-radius: var(--r3); padding: var(--s2); min-width: 220px; box-shadow: var(--shadow-lg); z-index: 25; display: none; animation: slideUp var(--dur) var(--ease-spring); }

<script type="module">

let PRICES = { small:{meet:0,trial:0,half:55,extended:70,full:80,overnight:100}, medium:{meet:0,trial:0,half:65,extended:80,full:90,overnight:115}, large:{meet:0,trial:0,half:75,extended:90,full:100,overnight:130} };
let ADDONS = { senior:12, puppy:12, med:5, diet:3, taxi:35 };

    }

const SESSION_LABELS = { meet:"Meet \u0026 greet", trial:"Trial day", half:"Half day", extended:"Extended half", full:"Full day", overnight:"Overnight" };

// Cancellation policy. 24h+ notice is free; inside 24h is charged at this rate.
const CANCEL_NOTICE_HOURS = 24;
const CANCEL_CHARGE_RATE  = 0.5;
const SIZE_LABELS = { small:"Small ≤10kg", medium:"Medium 10–25kg", large:"Large 25kg+" };

// Payment tracking is switched off for now. Flip to true to bring back
// "unpaid" tags on bookings and the "· $X paid" hints on day/week totals.
// (The Ledger tab keeps its payment detail regardless.)
const SHOW_PAYMENTS = false;

// Guards a double-tap on Save. The booking id is minted when the sheet opens,
// so two submits would push the SAME id twice and you'd get a duplicate row.
let savingBooking = false;

const uid = () => Math.random().toString(16).slice(2,10);
const localISO = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const todayISO = () => localISO(new Date());
const nowTime = () => { const d = new Date(); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
const isMeaningfulHealth = v => v && !/^(none|n\/a|nil|no|na|nothing|nope)( known)?[.!]?$/i.test(String(v).trim());
const fmtDateShort = iso => new Date(iso + "T00:00:00").toLocaleDateString('en-AU', { weekday:'short', day:'numeric', month:'short' });
const escapeHtml = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const truncate = (s, n) => { if (!s) return ''; s = String(s); return s.length > n ? s.slice(0, n) + '…' : s; };
const hapticTap = () => { try { navigator.vibrate?.(15); } catch {} };
const hapticSuccess = () => { try { navigator.vibrate?.([20, 40, 30]); } catch {} };

function emptyDb() {
  return { owners: [], dogs: [], bookings: [], packs: [], meta: { version:2, createdAt: new Date().toISOString(), lastBackup: null, capacity:{maxDaycare:5, maxBoarding:3} } };
}
// Two records can never legitimately share an id — that only happens when a
// double-tap pushed the same booking twice. Strip them on load.
function dedupeById(db) {
  if (!db || !Array.isArray(db.bookings)) return 0;
  const seen = new Set();
  const before = db.bookings.length;
  db.bookings = db.bookings.filter(b => {
    if (!b || !b.id) return true;
    if (seen.has(b.id)) return false;
    seen.add(b.id);
    return true;
  });
  return before - db.bookings.length;
}

function normalizeDb(db) {
  if (!db || typeof db !== 'object') return emptyDb();
  db.owners ||= []; db.dogs ||= []; db.bookings ||= []; db.packs ||= []; db.meta ||= {};
  db.meta.capacity ||= { maxDaycare:5, maxBoarding:3 };
  if (!(db.meta.capacity.maxDaycare > 0)) db.meta.capacity.maxDaycare = 5;
  if (!(db.meta.capacity.maxBoarding >= 0)) db.meta.capacity.maxBoarding = 3;
  const dropped = dedupeById(db);
  if (dropped) console.warn('Removed ' + dropped + ' duplicate booking(s) sharing an id');
  return db;
}

/* ---------- Pack helpers ---------- */
function packsForDog(dogId) { return DB.packs.filter(p => p.dogId === dogId); }
function activePacksForDog(dogId) {
  const today = todayISO();
  return packsForDog(dogId).filter(p => (p.daysUsed || 0) < p.size && p.expiryDate >= today);
}
function packSummary(p) {
  const used = p.daysUsed || 0;
  const remaining = p.size - used;
  const days = Math.ceil((new Date(p.expiryDate + 'T00:00:00') - new Date(todayISO() + 'T00:00:00')) / 86400000);
  return { used, remaining, expiresInDays: days, expired: days < 0 };
}
function calcPackPrice(dogSize, packSize) {
  const base = PRICES[dogSize]?.full || 90;
  const discount = packSize === 5 ? 0.10 : packSize === 10 ? 0.15 : 0;
  return Math.round(base * packSize * (1 - discount));
}
function loadFromStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return emptyDb();
    return normalizeDb(JSON.parse(raw));
  } catch { return emptyDb(); }
}

let DB = emptyDb();
let currentTab = 'day';
let searchQuery = '';
let ritualState = null;
let lastLocalSaveTs = parseInt(localStorage.getItem(LAST_SAVE_KEY) || '0', 10);
// Unique per-tab id — used for reliable self-write dedup so we don't rely on flaky client clocks
const CLIENT_ID = (crypto?.randomUUID?.() || Math.random().toString(36).slice(2)) + '-' + Date.now();
// Buffer for remote snapshots that arrive while a modal is open — applied on close
let pendingRemoteDb = null;

async function loadFromFirestore() {
  try {
    const snap = await getDoc(STATE_DOC);
    if (snap.exists()) {
      const r = snap.data();
      DB = normalizeDb({ owners: r.owners||[], dogs: r.dogs||[], bookings: r.bookings||[], packs: r.packs||[], meta: r.meta });
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); } catch (e) { console.warn('LS write failed', e); }
      return true;
    }
  } catch (e) {
    console.warn('Firestore load failed, using cache', e);
    DB = loadFromStorage();
    toast('Offline · using local cache', 'warn');
    return true;
  }
  return false;
}
function pruneOldPhotos(db) {
  // Drop photos from reports older than 30 days to keep the Firestore doc under 1MB.
  // The report text (mood, moments, story) stays forever — only images are heavy.
  const cutoffMs = Date.now() - 30 * 86400000;
  let dropped = 0;
  db.bookings.forEach(b => {
    if (!b.report?.photos?.length) return;
    const bookingDate = new Date(b.date + 'T00:00:00').getTime();
    if (bookingDate < cutoffMs) {
      dropped += b.report.photos.length;
      b.report.photos = [];
    }
  });
  return dropped;
}
// Reconcile the user's in-memory DB with any buffered remote snapshot before writing.
// For each collection: start from remote (has additions/deletions from other devices),
// then overlay the user's records — user's edits win on same id; remote records the user didn't touch survive.
function reconcileWithPending(db) {
  if (!pendingRemoteDb) return db;
  const merge = (base = [], mine = []) => {
    const map = new Map(base.map(x => [x.id, x]));
    mine.forEach(x => map.set(x.id, x));
    return [...map.values()];
  };
  const merged = normalizeDb({
    owners:   merge(pendingRemoteDb.owners,   db.owners),
    dogs:     merge(pendingRemoteDb.dogs,     db.dogs),
    bookings: merge(pendingRemoteDb.bookings, db.bookings),
    packs:    merge(pendingRemoteDb.packs,    db.packs),
    meta: db.meta || pendingRemoteDb.meta
  });
  // The user's in-memory DB now reflects the reconciled state
  DB = merged;
  pendingRemoteDb = null;
  return merged;
}

// Firestore rejects `undefined` values — walk the object and drop any keys whose value is undefined.
// Also normalises Date objects to ISO strings (Firestore rejects raw Date, would silently corrupt to {}).
function sanitizeForFirestore(x) {
  if (x === undefined || x === null) return null;
  if (x instanceof Date) return x.toISOString();
  if (typeof x === 'number' && !Number.isFinite(x)) return null; // NaN, Infinity
  if (Array.isArray(x)) return x.map(sanitizeForFirestore);
  if (typeof x === 'object') {
    const out = {};
    for (const k in x) {
      if (!Object.prototype.hasOwnProperty.call(x, k)) continue;
      const v = x[k];
      if (v === undefined) continue;
      out[k] = sanitizeForFirestore(v);
    }
    return out;
  }
  return x;
}

async function save(db) {
  db = reconcileWithPending(db);
  const now = Date.now();
  lastLocalSaveTs = now;
  pruneOldPhotos(db);
  try { localStorage.setItem(LAST_SAVE_KEY, String(now)); } catch {}
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }
  catch (e) { console.warn('LS quota', e); toast('Local cache full — cloud only', 'warn'); }
  try {
    const approxKB = Math.round(JSON.stringify(db).length / 1024);
    if (approxKB > 850) toast(`⚠ Data size ${approxKB} KB — approaching cloud limit`, 'warn');
  } catch {}
  try {
    const payload = sanitizeForFirestore({
      ...db,
      _updatedAt: new Date().toISOString(),
      _updatedAtMs: now,
      _updatedBy: fbAuth.currentUser?.email || 'unknown',
      _updatedByClientId: CLIENT_ID
    });
    await setDoc(STATE_DOC, payload);
    pendingRemoteDb = null;
    // Success — clear pending write counter + hide banner
    failedWriteCount = 0;
    hideSyncBanner();
    return true;
  } catch (e) {
    console.error('Firestore save failed', e);
    failedWriteCount++;
    showSyncBanner(failedWriteCount);
    toast('⚠ Cloud save failed', 'warn');
    return false;
  }
}
let failedWriteCount = 0;
function modalIsOpen() {
  return document.getElementById('modalHost')?.classList.contains('on') || !!ritualState;
}
function startRealtimeSync() {
  onSnapshot(STATE_DOC, snap => {
    if (!snap.exists()) return;
    const r = snap.data();
    // Reliable dedup: skip ONLY writes from this exact browser tab
    if (r._updatedByClientId === CLIENT_ID) return;
    const nextDb = normalizeDb({ owners: r.owners||[], dogs: r.dogs||[], bookings: r.bookings||[], packs: r.packs||[], meta: r.meta });
    // If a modal is open, buffer the remote update so we don't wipe the in-progress form
    if (modalIsOpen()) {
      pendingRemoteDb = nextDb;
      toast(`Remote changes pending — will apply when you close`, 'info');
      return;
    }
    DB = nextDb;
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); } catch {}
    render();
    const who = (r._updatedBy || '').split('@')[0];
    const me = (fbAuth.currentUser?.email || '').split('@')[0];
    toast(`Synced from ${who && who !== me ? who : 'other device'}`, 'info');
  }, err => { console.warn('Snapshot error', err); toast('Sync interrupted', 'warn'); });
}
// Apply any deferred remote snapshot when a modal/ritual closes — after the local save has settled
function drainPendingRemote() {
  if (!pendingRemoteDb) return;
  DB = pendingRemoteDb;
  pendingRemoteDb = null;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); } catch {}
  render();
  toast('Applied remote changes', 'info');
}

const dogById = id => DB.dogs.find(d => d.id === id);
const ownerById = id => DB.owners.find(o => o.id === id);
const ownerOf = dogId => { const d = dogById(dogId); return d ? ownerById(d.ownerId) : null; };
const dogsOfOwner = ownerId => DB.dogs.filter(d => d.ownerId === ownerId);
const bookingsForDate = iso => DB.bookings.filter(b => b.date === iso);

function calcTotal(booking, dog) {
  if (booking.cancelled) return booking.cancelCharge || 0;
  if (booking.session === 'meet' || booking.session === 'trial') return 0;
  if (booking.customPrice != null) return booking.customPrice;
  if (!dog) return 0;
  let t = PRICES[dog.size]?.[booking.session] || 0;
  if (booking.addOns?.senior) t += ADDONS.senior;
  if (booking.addOns?.puppy)  t += ADDONS.puppy;
  if (booking.addOns?.med)    t += ADDONS.med;
  if (booking.addOns?.diet)   t += ADDONS.diet;
  if (booking.addOns?.taxi)   t += ADDONS.taxi;
  if (booking.surcharges?.publicHoliday) t += SURCHARGES.publicHoliday;
  if (booking.surcharges?.xmasPeak) t += (booking.session === 'overnight' ? SURCHARGES.xmasPeakNight : SURCHARGES.xmasPeakDay);
  return t;
}

function computeStays(bookings) {
  const nightly = bookings.filter(b => b.session === 'overnight');
  const byDog = {};
  nightly.forEach(b => { (byDog[b.dogId] ||= []).push(b); });
  const stays = [];
  Object.entries(byDog).forEach(([dogId, arr]) => {
    arr.sort((a,b) => a.date.localeCompare(b.date));
    if (!arr.length) return;
    let group = [arr[0]];
    for (let i = 1; i < arr.length; i++) {
      const prev = new Date(arr[i-1].date + 'T00:00:00');
      const cur  = new Date(arr[i].date + 'T00:00:00');
      const gap = (cur - prev) / 86400000;
      if (gap === 1) group.push(arr[i]);
      else { stays.push({ dogId, bookings: group }); group = [arr[i]]; }
    }
    stays.push({ dogId, bookings: group });
  });
  return stays;
}
function stayForBookingId(bookingId) {
  const stays = computeStays(DB.bookings);
  return stays.find(s => s.bookings.some(b => b.id === bookingId));
}

async function downscalePhoto(file, maxSide=800, quality=0.72) {
  const dataUrl = await new Promise((res, rej) => { const r = new FileReader(); r.onload = e => res(e.target.result); r.onerror = rej; r.readAsDataURL(file); });
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = dataUrl; });
  let w = img.width, h = img.height;
  if (w > h && w > maxSide) { h = Math.round(h * maxSide / w); w = maxSide; }
  else if (h > maxSide) { w = Math.round(w * maxSide / h); h = maxSide; }
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  canvas.getContext('2d').drawImage(img, 0, 0, w, h);
  return canvas.toDataURL('image/jpeg', quality);
}

function toast(msg, kind) {
  const host = document.getElementById('toast-host');
  const t = document.createElement('div');
  t.className = 'toast' + (kind === 'warn' ? ' warn' : '');
  t.textContent = msg;
  host.appendChild(t);
  setTimeout(() => t.remove(), kind === 'warn' ? 5000 : 3000);
}

// Persistent banner for cloud-sync failures — doesn't fade
function showSyncBanner(pendingWrites) {
  const el = document.getElementById('sync-banner');
  if (!el) return;
  el.innerHTML = `
    <span class="msg">⚠ Cloud save failed — ${pendingWrites} change${pendingWrites===1?'':'s'} only on this device. Firestore rejected the write.</span>
    <button onclick="retryPendingSave()">Retry</button>
    <button onclick="hideSyncBanner()" style="background:transparent;border-color:transparent;padding:6px 8px;">×</button>`;
  el.style.display = 'flex';
}
function hideSyncBanner() { const el = document.getElementById('sync-banner'); if (el) el.style.display = 'none'; }
async function retryPendingSave() {
  hideSyncBanner();
  toast('Retrying…');
  await save(DB);
}

async function doSignIn(e) {
  e?.preventDefault();
  const email = document.getElementById('emailInput').value.trim();
  const pwd = document.getElementById('pwdInput').value;
  const err = document.getElementById('loginError');
  err.textContent = '';
  try { await signInWithEmailAndPassword(fbAuth, email, pwd); }
  catch (e) { err.textContent = e.code === 'auth/invalid-credential' ? 'Wrong email or password.' : e.message; }
  return false;

/* ---------- DAY ---------- */
function greeting() {
  const h = new Date().getHours();
  const dow = new Date().toLocaleDateString('en-AU', { weekday:'long' });
  const bks = bookingsForDate(todayISO());
  const n = bks.length;
  const friendWord = n === 1 ? 'one friend' : `${n} friends`;
  if (n === 0) return { line: `${dow}. <em>A quiet one.</em>`, sub: 'No dogs on the books today.' };
  if (h < 11) return { line: `${dow}. <em>${friendWord} today.</em>`, sub: 'Kettle on. Here\'s who\'s coming.' };
  if (h < 15) return { line: `${dow}. <em>Middle of the day.</em>`, sub: `${friendWord} through the door.` };
  if (h < 18) return { line: `${dow}. <em>Wrap-up time.</em>`, sub: 'Time to write today\'s stories.' };
  return { line: `${dow}. <em>Evening.</em>`, sub: 'The day\'s nearly closed.' };
}

function renderDay() {
  const iso = todayISO();
  const g = greeting();
  const bks = bookingsForDate(iso).slice().sort((a,b) => (a.arrivalTime||'99').localeCompare(b.arrivalTime||'99'));

  let html = `<h1 class="greet">${g.line}</h1><p class="sub">${g.sub}</p>`;

  if (!bks.length) {
    html += `<div class="day-empty">Nothing on today. Take a walk.</div>
      <p class="text-center"><button class="btn ghost mt-2" onclick="openAddMenuSheet()">＋ Add something</button></p>`;
    return html;
  }

  // Same dog booked twice in one day is almost always a duplicate, not a real
  // second visit. Say so rather than quietly listing them twice.
  const seen = {};
  bks.forEach(b => { seen[b.dogId] = (seen[b.dogId] || 0) + 1; });
  const dupes = Object.keys(seen).filter(id => seen[id] > 1)
    .map(id => dogById(id)?.name).filter(Boolean);

  const n = bks.length;
  html += `<div class="today-count">${n} ${n === 1 ? 'dog' : 'dogs'} today</div>`;

  if (dupes.length) {
    html += `<div class="today-warn">${escapeHtml(dupes.join(', '))} ${dupes.length === 1 ? 'is' : 'are'} listed twice — likely a duplicate booking. Tap to check.</div>`;
  }

  html += `<div class="today-list">${bks.map(b => dayRow(b, seen[b.dogId] > 1)).join('')}</div>`;

  const ready = bks.filter(b => b.arrivalLogged && !b.report?.sentAt);
  if (ready.length) {
    html += `<p class="text-center" style="margin-top:20px">
      <button class="btn ghost" data-startritual>Write today's stories · ${ready.length}</button>
    </p>`;
  }
  return html;
}

function dayRow(b, isDupe) {
  const dog = dogById(b.dogId);
  const owner = dog ? ownerOf(b.dogId) : null;
  const isNight = b.session === 'overnight';

  let note = SESSION_LABELS[b.session] || b.session;
  if (isNight) {
    const stay = stayForBookingId(b.id);
    if (stay && stay.bookings.length > 1) {
      note += ` · night ${stay.bookings.findIndex(x => x.id === b.id) + 1} of ${stay.bookings.length}`;
    }
  }

  let status = '', action = '';
  if (b.cancelled) {
    status = `<span class="row-cancel">Cancelled${b.cancelCharge ? ' · $' + b.cancelCharge : ' · no charge'}</span>`;
    action = `<button class="btn tiny" onclick="uncancelBooking('${b.id}')">Undo</button>`;
  } else if (b.departureLogged) {
    status = `<span class="row-done">Left ${b.departureLogged}</span>`;
  } else if (b.arrivalLogged) {
    status = `<span class="row-here">Here since ${b.arrivalLogged}</span>`;
    action = `<button class="btn tiny" data-depart="${b.id}">Picked up</button>`;
  } else {
    action = `<button class="btn tiny" data-arrive="${b.id}">Arrived</button>`
           + `<button class="btn tiny" onclick="openCancelSheet('${b.id}')">Cancel</button>`;
  }

  return `<div class="today-row ${isDupe ? 'dupe' : ''} ${b.cancelled ? 'cancelled' : ''}">
    <div class="today-face ${isNight ? 'night' : ''}" data-openbk="${b.id}">${dog ? photoOrGlyph(dog) : '?'}</div>
    <div class="today-body" data-openbk="${b.id}">
      <div class="today-name">${escapeHtml(dog?.name || 'Unknown dog')}</div>
      <div class="today-meta">${escapeHtml(owner?.name || '—')} · ${note}</div>
    </div>
    <div class="today-right">${status}${action}</div>
  </div>`;
}

function renderStayItem(b) {
  const dog = dogById(b.dogId); if (!dog) return '';
  const owner = ownerOf(b.dogId);
  const stay = stayForBookingId(b.id);
  const nights = stay ? stay.bookings.length : 1;
  const idx = stay ? stay.bookings.findIndex(x => x.id === b.id) + 1 : 1;
  const nightLabel = nights > 1 ? ` · night ${idx} of ${nights}` : '';
  const face = photoOrGlyph(dog);
  const acts = [];
  if (!b.arrivalLogged) acts.push(`<button class="btn" data-arrive="${b.id}">Arrived</button>`);
  if (b.arrivalLogged && !b.departureLogged) acts.push(`<button class="btn" data-depart="${b.id}">Picked up</button>`);
  if (b.paymentStatus !== 'paid') acts.push(`<button class="btn" data-pay="${b.id}">Paid</button>`);
