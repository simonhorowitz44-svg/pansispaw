function wireSwipe(wrap) {
  const card = wrap.querySelector('.dog-card');
  const stamp = wrap.querySelector('.paw-stamp');
  const bkId = wrap.dataset.swipeBk;
  let startX = 0, dx = 0, active = false;
  const start = e => { active = true; startX = e.touches ? e.touches[0].clientX : e.clientX; wrap.classList.add('swiping'); };
  const move = e => {
    if (!active) return;
    const x = e.touches ? e.touches[0].clientX : e.clientX;
    dx = Math.max(0, x - startX);
    card.style.transform = `translateX(${dx}px)`;
  };
  const end = () => {
    if (!active) return;
    active = false; wrap.classList.remove('swiping');
    const threshold = wrap.offsetWidth * 0.45;
    if (dx > threshold) {
      card.style.transform = `translateX(${wrap.offsetWidth}px)`;
      stamp?.classList.add('on');
      hapticSuccess();
      setTimeout(() => arriveDog(bkId), 260);
    } else { card.style.transform = ''; }
    dx = 0;
  };
  wrap.addEventListener('touchstart', start, { passive: true });
  wrap.addEventListener('touchmove', move, { passive: true });
  wrap.addEventListener('touchend', end);
  wrap.addEventListener('mousedown', start);
  wrap.addEventListener('mousemove', move);
  wrap.addEventListener('mouseup', end);
  wrap.addEventListener('mouseleave', () => { if (active) end(); });
}

async function triggerQuickPhoto(bookingId) {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*'; input.capture = 'environment';
  input.onchange = async e => {
    const file = e.target.files[0]; if (!file) return;
    const b = DB.bookings.find(x => x.id === bookingId); if (!b) return;
    try {
      const data = await downscalePhoto(file);
      b.report = b.report || { photos: [], mood: [], moments: [], story: '', sentAt: null };
      b.report.photos = b.report.photos || [];
      if (b.report.photos.length >= 8) { toast('Max 8 photos per dog'); return; }
      b.report.photos.push({ data, addedAt: new Date().toISOString() });
      await save(DB); render();
      hapticTap(); toast('Photo saved');
    } catch (err) { console.error(err); toast('Couldn\'t process photo'); }
  };
  input.click();
}

/* ---------- WEEK ---------- */
function renderWeek() {
  const today = new Date(todayISO() + 'T00:00:00');
  const dow = (today.getDay() + 6) % 7;
  const monday = new Date(today); monday.setDate(today.getDate() - dow);
  const cap = DB.meta.capacity;
  const isDesktop = window.innerWidth >= 900;
  const isPastMode = weekViewMode === 'past';

  const modeToggle = `<div class="week-mode-switch">
    <button class="week-mode-btn ${!isPastMode?'on':''}" onclick="setWeekMode('upcoming')">☾ Upcoming</button>
    <button class="week-mode-btn ${isPastMode?'on':''}" onclick="setWeekMode('past')">◄ History</button>
  </div>`;

  const title = isPastMode ? 'History' : 'This week <em>&amp; next</em>';
  const sub = isPastMode
    ? `Everything that's already happened. Nothing here can be added — only reviewed and edited.`
    : `Each day is a page. Tap an empty day to add. Empty days keep quiet.`;

  let html = `<h1 class="greet">${title}</h1>
    <p class="sub tight">${sub}</p>
    ${modeToggle}`;

  const stays = computeStays(DB.bookings);

  const buildDay = (d, opts={}) => {
    const iso = localISO(d);
    const isToday = iso === todayISO();
    const isPast = iso < todayISO();
    const bks = bookingsForDate(iso).slice().sort((a,b) => (a.session === 'overnight' ? 1 : 0) - (b.session === 'overnight' ? 1 : 0));
    if (!bks.length) {
      return `<div class="week-day empty ${isPast?'past':''}" data-emptyday="${iso}" role="button" tabindex="0">
        <span>${d.toLocaleDateString('en-AU', { weekday:'short' })} · ${d.getDate()} ${d.toLocaleDateString('en-AU', { month:'short' })}</span>
        <span>${opts.mini ? '＋' : 'Free — tap to add'}</span>
      </div>`;
    }
    const dayCount = bks.filter(b => b.session !== 'overnight' && b.session !== 'meet').length;
    const nightCount = bks.filter(b => b.session === 'overnight').length;
    const dayPct = Math.min(100, Math.round(dayCount / cap.maxDaycare * 100));
    const nightPct = cap.maxBoarding ? Math.min(100, Math.round(nightCount / cap.maxBoarding * 100)) : 0;
    const rev = bks.reduce((s,b) => s + (b.total || 0), 0);
    const paidRev = bks.filter(b => b.paymentStatus === 'paid').reduce((s,b) => s + (b.total || 0), 0);

    // One pass: every booking dated today renders exactly one row, and the day
    // total is accumulated from those same rows. They cannot disagree.
    let rows = '', dayTotal = 0;
    bks.forEach(b => {
      const amt = b.total != null ? b.total : calcTotal(b, dogById(b.dogId));
      dayTotal += amt;
      let context = '';
      if (b.session === 'overnight') {
        const stay = stays.find(s => s.bookings.some(x => x.id === b.id));
        if (stay && stay.bookings.length > 1) {
          const n = stay.bookings.findIndex(x => x.id === b.id) + 1;
          context = `night ${n} of ${stay.bookings.length}`;
        }
      }
      rows += weekDogRow(b, { amt, context });
    });

    return `<div class="week-day ${isToday?'today':''} ${isPast&&!isToday?'past':''}">
      <div class="week-day-head">
        <div class="week-day-name">${d.getDate()} ${d.toLocaleDateString('en-AU', { month:'short' })}<span class="dow">${d.toLocaleDateString('en-AU', { weekday: opts.mini ? 'short' : 'long' })}</span></div>
        <button class="day-add" data-emptyday="${iso}" title="Add booking for this day" aria-label="Add booking">＋</button>
      </div>
      <div class="week-day-cap">
        <span>☀ ${dayCount}/${cap.maxDaycare}<span class="cap-bar"><span style="width:${dayPct}%" class="${dayPct>=100?'full':''}"></span></span></span>
        ${cap.maxBoarding ? `<span>☾ ${nightCount}/${cap.maxBoarding}<span class="cap-bar"><span style="width:${nightPct}%" class="night ${nightPct>=100?'full':''}"></span></span></span>` : ''}
      </div>
      ${rows}
      <div class="day-total">
        <span class="dt-label">${bks.length} ${bks.length === 1 ? 'booking' : 'bookings'}</span>
        <span class="dt-amt">$${dayTotal}</span>
      </div>
    </div>`;
  };

  // Compute per-week revenue
  const weekRevFor = (weekMonday) => {
    let bookedRev = 0, paidRev = 0, count = 0;
    for (let i = 0; i < 7; i++) {
      const d = new Date(weekMonday); d.setDate(weekMonday.getDate() + i);
      const iso = localISO(d);
      const dayBks = bookingsForDate(iso);
      count += dayBks.length;
      bookedRev += dayBks.reduce((s,b) => s + (b.total != null ? b.total : calcTotal(b, dogById(b.dogId))), 0);
      paidRev += dayBks.filter(b => b.paymentStatus === 'paid').reduce((s,b) => s + (b.total||0), 0);
    }
    return { bookedRev, paidRev, count };
  };
  const weekHeader = (weekMonday, w) => {
    const stats = weekRevFor(weekMonday);
    const label = w === 0 ? 'This week' : w === 1 ? 'Next week' : `Week of ${weekMonday.getDate()} ${weekMonday.toLocaleDateString('en-AU',{month:'short'})}`;
    if (!stats.count) return `<div class="week-header">${label}<span class="week-total muted">Free</span></div>`;
    return `<div class="week-header">${label}<span class="week-total"><b>$${stats.bookedRev.toLocaleString()}</b>${SHOW_PAYMENTS && stats.paidRev < stats.bookedRev ? `<span class="muted"> · $${stats.paidRev.toLocaleString()} paid</span>` : ''}</span></div>`;
  };

  const weeksToShow = isPastMode ? weekPastWeeks : weekViewWeeks;
  // In past mode: iterate BACK from the week before this one, most recent first
  const startWeekOffset = isPastMode ? -1 : 0;
  const direction = isPastMode ? -1 : 1;
  const pastLabel = (w, weekStart) => {
    // For past mode, w is negative offset from current week
    const absW = Math.abs(w);
    if (absW === 1) return 'Last week';
    if (absW === 2) return '2 weeks ago';
    if (absW === 3) return '3 weeks ago';
    return `Week of ${weekStart.getDate()} ${weekStart.toLocaleDateString('en-AU',{month:'short'})}`;
  };
  const weekHeaderMode = (weekStart, w) => {
    if (!isPastMode) return weekHeader(weekStart, w);
    const stats = weekRevFor(weekStart);
    const label = pastLabel(w, weekStart);
    if (!stats.count) return `<div class="week-header">${label}<span class="week-total muted">Nothing booked</span></div>`;
    return `<div class="week-header">${label}<span class="week-total"><b>$${stats.bookedRev.toLocaleString()}</b>${SHOW_PAYMENTS && stats.paidRev < stats.bookedRev ? `<span class="muted"> · $${stats.paidRev.toLocaleString()} paid</span>` : ''}</span></div>`;
  };

  if (isDesktop) {
    for (let step = 0; step < weeksToShow; step++) {
      const w = isPastMode ? -(step + 1) : step;
      const weekStart = new Date(monday); weekStart.setDate(monday.getDate() + w*7);
      html += weekHeaderMode(weekStart, w);
      html += `<div class="week-grid-desktop">`;
      for (let i = 0; i < 7; i++) {
        const d = new Date(weekStart); d.setDate(weekStart.getDate() + i);
        html += buildDay(d, { mini: true }) || `<div></div>`;
      }
      html += `</div>`;
    }
  } else {
    for (let step = 0; step < weeksToShow; step++) {
      const w = isPastMode ? -(step + 1) : step;
      const weekStart = new Date(monday); weekStart.setDate(monday.getDate() + w*7);
      html += weekHeaderMode(weekStart, w);
      for (let i = 0; i < 7; i++) {
        const d = new Date(weekStart); d.setDate(weekStart.getDate() + i);
        html += buildDay(d);
      }
    }
  }
  html += `<div class="text-center mt-2">
    <button class="btn ghost" onclick="showMoreWeeks()">＋ Show 4 more weeks</button>
  </div>`;
  return html;
}
function showMoreWeeks() {
  if (weekViewMode === 'past') weekPastWeeks += 4; else weekViewWeeks += 4;
  render(); window.scrollTo({ top: document.body.scrollHeight, behavior:'smooth' });
}
function setWeekMode(m) { weekViewMode = m; render(); window.scrollTo({ top: 0, behavior:'smooth' }); }

function weekDogRow(b, opts = {}) {
  const dog = dogById(b.dogId);
  const amt = opts.amt != null ? opts.amt : (b.total != null ? b.total : calcTotal(b, dog));
  const isNight = b.session === 'overnight';

  // A booking with no dog record still costs money and still counts toward the
  // day total — so it gets a visible row. Silently dropping it made the rows
  // disagree with the total, which is how this whole thing got confusing.
  if (!dog) {
    return `<div class="week-dog-row orphan" data-openbk="${b.id}">
      <div class="week-dog-face">?</div>
      <div class="week-dog-body">
        <div class="week-dog-name">Unknown dog</div>
        <div class="week-dog-meta">No dog record — tap to fix</div>
      </div>
      <div class="week-dog-price">$${amt}</div>
    </div>`;
  }

  const owner = ownerOf(b.dogId);
  const unpaidTag = (SHOW_PAYMENTS && b.paymentStatus !== 'paid') ? ' · <span class="text-owe">unpaid</span>' : '';
  const context = opts.context ? ` · ${opts.context}` : '';
  return `<div class="week-dog-row ${b.cancelled ? 'cancelled' : ''}" data-openbk="${b.id}">
    <div class="week-dog-face ${isNight?'night':''}">${photoOrGlyph(dog)}</div>
    <div class="week-dog-body">
      <div class="week-dog-name">${escapeHtml(dog.name)} <span class="muted small">· ${escapeHtml(owner?.name || '—')}</span></div>
      <div class="week-dog-meta">${b.cancelled ? 'Cancelled' + (b.cancelCharge ? ' · $' + b.cancelCharge + ' charged' : ' · no charge') : SESSION_LABELS[b.session] + context + unpaidTag}</div>
    </div>
    <div class="week-dog-price">$${amt}</div>
  </div>`;
}


/* ---------- BANK RECONCILIATION ---------------------------------------- */
/* Upload a bank CSV, match credits against unpaid bookings by name + amount. */

function parseCSV(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"' && text[i+1] === '"') { cell += '"'; i++; }
      else if (ch === '"') q = false;
      else cell += ch;
    } else if (ch === '"') q = true;
    else if (ch === ',') { row.push(cell); cell = ''; }
    else if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (ch !== '\r') cell += ch;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim()));
}

// Banks all format differently. Find the columns by looking at the data.
function readBankRows(rows) {
  if (!rows.length) return [];
  const looksNum = s => /^[+-]?[\d,]+\.?\d*$/.test(String(s).replace(/[$\s]/g,'')) && String(s).trim() !== '';
  const looksDate = s => /\d{1,4}[\/\-]\d{1,2}[\/\-]\d{1,4}/.test(String(s));
  const head = rows[0].map(h => String(h).toLowerCase().trim());
  const hasHeader = head.some(h => /date|description|amount|credit|debit|narrative|particulars/.test(h));
  const body = hasHeader ? rows.slice(1) : rows;
  let iDate = -1, iDesc = -1, iAmt = -1, iCredit = -1;
  if (hasHeader) {
    // "Transaction Type" and "Description" both contain likely words, so rank them.
    const descRank = h => /narrative|particular/.test(h) ? 1
      : /descript/.test(h) ? 2 : /detail/.test(h) ? 3
      : /reference/.test(h) ? 4 : /transaction/.test(h) ? 5 : 99;
    let bestDesc = 99;
    head.forEach((h, i) => {
      if (iDate < 0 && /date/.test(h)) iDate = i;
      const dr = descRank(h);
      if (dr < bestDesc) { bestDesc = dr; iDesc = i; }
      if (iCredit < 0 && /credit|deposit|money in/.test(h) && !/card/.test(h)) iCredit = i;
      if (iAmt < 0 && /amount/.test(h) && !/debit|credit/.test(h)) iAmt = i;
    });
    if (bestDesc === 99) iDesc = -1;
  }
  if (iDate < 0 || iDesc < 0 || (iAmt < 0 && iCredit < 0)) {
    const probe = body[0] || [];
    probe.forEach((v, i) => {
      if (iDate < 0 && looksDate(v)) iDate = i;
      else if (iAmt < 0 && iCredit < 0 && looksNum(v)) iAmt = i;
    });
    if (iDesc < 0) iDesc = probe.findIndex((v, i) => i !== iDate && i !== iAmt && String(v).trim().length > 3);
  }
  const num = s => parseFloat(String(s == null ? '' : s).replace(/[$,\s]/g, '')) || 0;
  return body.map(r => {
    const amt = iCredit >= 0 && num(r[iCredit]) ? num(r[iCredit]) : num(r[iAmt]);
    return { date: String(r[iDate] || '').trim(), desc: String(r[iDesc] || '').trim(), amount: amt };
  }).filter(t => t.amount > 0 && t.desc);
}

// Strip the bank's noise so the human part of the reference is left.
function cleanRef(s) {
  return String(s).toUpperCase()
    .replace(/\b(OSKO|PAYID|PAY ?ID|NPP|BPAY|EFTPOS|DIRECT CREDIT|TRANSFER FROM|TRANSFER|FROM|DEPOSIT|RECEIPT|REF|PAYMENT|PYMT|INTERNET|MOBILE|SALARY)\b/g, ' ')
    .replace(/\b\d{4,}\b/g, ' ')
    .replace(/[^A-Z\s]/g, ' ')
    .replace(/\s+/g, ' ').trim();
}

function outstandingByOwner() {
  const map = {};
  const entry = o => (map[o.id] ||= { owner: o, bookings: [], packs: [], total: 0 });
  // Bookings redeemed against a pack are already $0 and paid, so they fall out here.
  DB.bookings.forEach(b => {
    if (b.paymentStatus === 'paid' || b.cancelled) return;
    if (!b.total) return;
    const dog = dogById(b.dogId); if (!dog) return;
    const o = ownerOf(b.dogId); if (!o) return;
    const e = entry(o); e.bookings.push(b); e.total += b.total;
  });
  // Packs are pre-paid, so an unconfirmed pack is a lump sum still to land.
  (DB.packs || []).forEach(pk => {
    if (pk.paidAt) return;
    if (!pk.paidAmount) return;
    const o = ownerOf(pk.dogId); if (!o) return;
    const e = entry(o); e.packs.push(pk); e.total += pk.paidAmount;
  });
  return map;
}

function matchTransaction(tx, owed) {
  const ref = cleanRef(tx.desc);
  if (!ref) return [];
  const words = ref.split(' ').filter(w => w.length > 2);
  const scored = [];
  Object.values(owed).forEach(entry => {
    const names = [entry.owner.name || ''];
    entry.bookings.forEach(b => { const d = dogById(b.dogId); if (d) names.push(d.name); });
    (entry.packs || []).forEach(p => { const d = dogById(p.dogId); if (d) names.push(d.name); });
    let hit = 0;
    names.forEach(n => {
      const parts = String(n).toUpperCase().split(/\s+/).filter(p => p.length > 2);
      parts.forEach(p => { if (words.some(w => w === p || w.includes(p) || p.includes(w))) hit++; });
    });
    if (!hit) return;
    const exactTotal = Math.abs(entry.total - tx.amount) < 0.01;
    const single = entry.bookings.find(b => Math.abs(b.total - tx.amount) < 0.01);
    const pack = (entry.packs || []).find(p => Math.abs(p.paidAmount - tx.amount) < 0.01);
    scored.push({
      entry, hit,
      score: hit * 10 + (exactTotal ? 100 : 0) + (pack ? 90 : 0) + (single ? 60 : 0),
      exactTotal, single, pack
    });
  });
  return scored.sort((a, b) => b.score - a.score).slice(0, 3);
}

let RECON = [];

function openReconcileSheet() {
  openSheet(`<h2 class="sheet-title">Reconcile payments</h2>
    <p class="sheet-sub">Upload your bank CSV. We'll match credits to unpaid bookings by name and amount.</p>
    <label class="btn primary block big" style="cursor:pointer">
      💳 Choose bank CSV <input type="file" accept=".csv,text/csv" style="display:none" onchange="onReconFile(event)">
    </label>
    <p class="sub small" style="margin-top:14px">Nothing is sent anywhere — the file is read in your browser.</p>`);
}

function onReconFile(e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const txs = readBankRows(parseCSV(r.result));
      if (!txs.length) return alert('No incoming payments found in that file. Check it has date, description and amount columns.');
      const owed = outstandingByOwner();
      RECON = txs.map(tx => ({ tx, matches: matchTransaction(tx, owed), done: false }));
      renderReconcile();
    } catch (err) { alert('Could not read that file: ' + err.message); }
  };
  r.readAsText(f);
}

function renderReconcile() {
  const matched = RECON.filter(r => r.matches.length && !r.done);
  const unmatched = RECON.filter(r => !r.matches.length && !r.done);
  const done = RECON.filter(r => r.done);
  const owed = outstandingByOwner();
  const totalOwed = Object.values(owed).reduce((s, e) => s + e.total, 0);

  const card = (r, i) => {
    const m = r.matches[0];
    const conf = m.exactTotal ? 'exact match on total'
      : m.pack ? `matches a ${m.pack.size}-day pack`
      : m.single ? 'matches one booking' : 'name matches, amount differs';
    const dogs = [...new Set([...m.entry.bookings.map(b => (dogById(b.dogId) || {}).name),
      ...(m.entry.packs || []).map(p => (dogById(p.dogId) || {}).name)].filter(Boolean))].join(', ');
    return `<div class="recon-row">
      <div class="recon-tx">
        <div class="recon-desc">${escapeHtml(r.tx.desc)}</div>
        <div class="recon-meta">${escapeHtml(r.tx.date)} · $${r.tx.amount.toFixed(2)}</div>
      </div>
      <div class="recon-match ${m.exactTotal ? 'strong' : ''}">
        <div class="recon-name">${escapeHtml(m.entry.owner.name)}${dogs ? ' · ' + escapeHtml(dogs) : ''}</div>
        <div class="recon-meta">${m.entry.bookings.length} unpaid${(m.entry.packs||[]).length ? ' + ' + m.entry.packs.length + ' pack' : ''} · $${m.entry.total} owing · ${conf}</div>
      </div>
      <button class="btn tiny" onclick="applyRecon(${i})">Mark paid</button>
    </div>`;
  };

  openSheet(`<h2 class="sheet-title">Reconcile payments</h2>
    <p class="sheet-sub">${RECON.length} credits in the file · $${totalOwed.toLocaleString()} outstanding across ${Object.keys(owed).length} clients</p>
    ${matched.length ? `<div class="section-title">Matched (${matched.length})</div>
      ${matched.map(r => card(r, RECON.indexOf(r))).join('')}
      <button class="btn primary block" style="margin-top:12px" onclick="applyAllRecon()">Mark all ${matched.length} paid</button>` : ''}
    ${done.length ? `<div class="section-title" style="margin-top:20px">Done (${done.length})</div>
      ${done.map(r => `<div class="recon-row done"><div class="recon-tx"><div class="recon-desc">${escapeHtml(r.tx.desc)}</div><div class="recon-meta">$${r.tx.amount.toFixed(2)} · marked paid</div></div></div>`).join('')}` : ''}
    ${unmatched.length ? `<div class="section-title" style="margin-top:20px">No match (${unmatched.length})</div>
      ${unmatched.map(r => `<div class="recon-row"><div class="recon-tx"><div class="recon-desc">${escapeHtml(r.tx.desc)}</div><div class="recon-meta">${escapeHtml(r.tx.date)} · $${r.tx.amount.toFixed(2)}</div></div><div class="recon-meta">Match by hand</div></div>`).join('')}` : ''}
  `);
}

async function applyRecon(i) {
  const r = RECON[i]; if (!r || r.done) return;
  const m = r.matches[0]; if (!m) return;
  const now = new Date().toISOString();
  let label;
  if (m.pack && !m.exactTotal) {
    m.pack.paidAt = now; label = `${m.pack.size}-day pack`;
  } else {
    const targets = m.single && !m.exactTotal ? [m.single] : m.entry.bookings;
    targets.forEach(b => { b.paymentStatus = 'paid'; b.paidAt = now; });
    if (m.exactTotal) (m.entry.packs || []).forEach(p => { p.paidAt = now; });
    label = `${targets.length} booking(s)`;
  }
  r.done = true;
  await save(DB);
  renderReconcile();
  toast(`${m.entry.owner.name} · ${label} marked paid`);
}

async function applyAllRecon() {
  const now = new Date().toISOString();
  let n = 0;
  RECON.forEach(r => {
    if (r.done || !r.matches.length) return;
    const m = r.matches[0];
    if (m.pack && !m.exactTotal) { m.pack.paidAt = now; n++; }
    else {
      const targets = m.single && !m.exactTotal ? [m.single] : m.entry.bookings;
      targets.forEach(b => { b.paymentStatus = 'paid'; b.paidAt = now; });
      if (m.exactTotal) (m.entry.packs || []).forEach(p => { p.paidAt = now; });
      n += targets.length;
    }
    r.done = true;
  });
  await save(DB);
  renderReconcile();
  toast(`${n} bookings marked paid`);
}

/* ---------- LEDGER ---------- */
let ledgerPeriod = 'month';
let weekViewWeeks = 8;
let weekViewMode = 'upcoming'; // 'upcoming' | 'past'
let weekPastWeeks = 8;

function ledgerRange() {
  const now = new Date();
  if (ledgerPeriod === 'week') {
    const dow = (now.getDay() + 6) % 7;
    const start = new Date(now); start.setDate(now.getDate() - dow); start.setHours(0,0,0,0);
    const prevStart = new Date(start); prevStart.setDate(start.getDate() - 7);
    const prevEnd = new Date(start); prevEnd.setDate(start.getDate() - 1);
    return { start, end: now, prevStart, prevEnd, label: 'this week', prevLabel: 'last week' };
  }
  if (ledgerPeriod === 'quarter') {
    const q = Math.floor(now.getMonth() / 3);
    const start = new Date(now.getFullYear(), q*3, 1);
    const prevStart = new Date(now.getFullYear(), q*3 - 3, 1);
    const prevEnd = new Date(now.getFullYear(), q*3, 0);
    return { start, end: now, prevStart, prevEnd, label: 'this quarter', prevLabel: 'last quarter' };
  }
  if (ledgerPeriod === 'year') {
    const start = new Date(now.getFullYear(), 0, 1);
    const prevStart = new Date(now.getFullYear()-1, 0, 1);
    const prevEnd = new Date(now.getFullYear()-1, 11, 31);
    return { start, end: now, prevStart, prevEnd, label: now.getFullYear() + ' so far', prevLabel: (now.getFullYear()-1) + ' full year' };
  }
  const start = new Date(now.getFullYear(), now.getMonth(), 1);
  const prevStart = new Date(now.getFullYear(), now.getMonth()-1, 1);
  const prevEnd = new Date(now.getFullYear(), now.getMonth(), 0);
  return { start, end: now, prevStart, prevEnd, label: now.toLocaleDateString('en-AU',{month:'long'}), prevLabel: prevStart.toLocaleDateString('en-AU',{month:'long'}) };
}

function renderLedger() {
  const now = new Date();
  const R = ledgerRange();
  const cap = DB.meta.capacity;
  const inR = (iso, s, e) => iso >= localISO(s) && iso <= localISO(e);

  const currentBks = DB.bookings.filter(b => inR(b.date, R.start, R.end));
  const prevBks    = DB.bookings.filter(b => inR(b.date, R.prevStart, R.prevEnd));
  const paidInR    = DB.bookings.filter(b => b.paymentStatus === 'paid' && b.paidAt && b.paidAt.slice(0,10) >= localISO(R.start) && b.paidAt.slice(0,10) <= localISO(R.end));

  const bookedRev = currentBks.reduce((s,b) => s + (b.total||0), 0);
  const prevRev = prevBks.reduce((s,b) => s + (b.total||0), 0);
  const paidRev = paidInR.reduce((s,b) => s + (b.total||0), 0);
  const upcomingBks = DB.bookings.filter(b => b.date > localISO(now));
  const upcomingRev = upcomingBks.reduce((s,b) => s + (b.total||0), 0);
  const delta = prevRev ? Math.round((bookedRev - prevRev) / prevRev * 100) : null;

  // Projection (month only)
  let projectionLine = '';
  if (ledgerPeriod === 'month') {
    const daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
    const dayOfMonth = now.getDate();
    if (dayOfMonth < daysInMonth && bookedRev > 0) {
      const paceProjection = Math.round((bookedRev / dayOfMonth) * daysInMonth);
      projectionLine = ` · pace $${paceProjection.toLocaleString()}`;
    }
  }

  // Service split
  const daycareBks = currentBks.filter(b => b.session !== 'overnight');
  const boardingBks = currentBks.filter(b => b.session === 'overnight');
  const daycareRev = daycareBks.reduce((s,b) => s + (b.total||0), 0);
  const boardingRev = boardingBks.reduce((s,b) => s + (b.total||0), 0);
  const dayPct = bookedRev ? Math.round(daycareRev / bookedRev * 100) : 0;

  // Occupancy
  const daysCovered = Math.max(1, Math.ceil((R.end - R.start) / 86400000) + 1);
  const totalDaySlots = daysCovered * cap.maxDaycare;
  const totalNightSlots = daysCovered * cap.maxBoarding;
  const dayOccupancy = totalDaySlots ? Math.round(daycareBks.length / totalDaySlots * 100) : 0;
  const nightOccupancy = totalNightSlots ? Math.round(boardingBks.length / totalNightSlots * 100) : 0;

  const avgBooking = currentBks.length ? Math.round(bookedRev / currentBks.length) : 0;

  // Trend — last 6 months booked revenue
  const trend = [];
  for (let i = 5; i >= 0; i--) {
    const s = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const e = new Date(now.getFullYear(), now.getMonth() - i + 1, 0);
    const rev = DB.bookings.filter(b => b.date >= localISO(s) && b.date <= localISO(e)).reduce((sum,b) => sum + (b.total||0), 0);
    trend.push({ label: s.toLocaleDateString('en-AU',{month:'short'}), rev });
  }
  const trendMax = Math.max(1, ...trend.map(t => t.rev));

  // Top clients (by revenue in current period)
  const clientRev = {};
  currentBks.forEach(b => {
    const o = ownerOf(b.dogId);
    if (!o) return;
    clientRev[o.id] = (clientRev[o.id] || 0) + (b.total||0);
  });
  const topClients = Object.entries(clientRev).sort((a,b) => b[1] - a[1]).slice(0, 5);

  // Aging (unpaid, oldest first)
  const unpaid = DB.bookings.filter(b => b.paymentStatus !== 'paid' && b.date <= localISO(now)).sort((a,b) => a.date.localeCompare(b.date));
  const unpaidTotal = unpaid.reduce((s,b) => s + (b.total||0), 0);
  const overdue7 = unpaid.filter(b => (now - new Date(b.date + 'T00:00:00')) / 86400000 > 7);
  const overdue30 = unpaid.filter(b => (now - new Date(b.date + 'T00:00:00')) / 86400000 > 30);

  const recent = DB.bookings.filter(b => b.paymentStatus === 'paid').sort((a,b) => (b.paidAt||b.date).localeCompare(a.paidAt||a.date)).slice(0, 8);

  const periodBtn = (val, label) => `<button class="period-btn ${ledgerPeriod===val?'on':''}" onclick="setLedgerPeriod('${val}')">${label}</button>`;

  let html = `<h1 class="greet">The ledger</h1>
    <p class="sub tight">Kept honest.</p>

    <div class="period-switch">
      ${periodBtn('week','Week')}${periodBtn('month','Month')}${periodBtn('quarter','Quarter')}${periodBtn('year','Year')}
    </div>

    <div class="ledger-hero">
      <div class="ledger-num">$${bookedRev.toLocaleString()}</div>
      <div class="ledger-caption">booked in ${R.label}${projectionLine}${delta !== null ? ` — <span class="ledger-delta ${delta >= 0 ? 'up' : 'down'}">${delta >= 0 ? '↑' : '↓'} ${Math.abs(delta)}% vs ${R.prevLabel}</span>` : ''}</div>
      <div class="ledger-sub">
        <span>Paid in: <b>$${paidRev.toLocaleString()}</b></span>
        <span>Ahead: <b>$${upcomingRev.toLocaleString()}</b></span>
        <span>Avg booking: <b>$${avgBooking}</b></span>
      </div>
    </div>

    <div class="section-title">6-month trend</div>
    <div class="trend-chart">
      ${trend.map(t => {
        const h = Math.round(t.rev / trendMax * 100);
        const isCurrent = t.label === now.toLocaleDateString('en-AU',{month:'short'});
        return `<div class="trend-bar ${isCurrent?'current':''}">
          <div class="trend-value">$${t.rev >= 1000 ? (t.rev/1000).toFixed(1) + 'k' : t.rev}</div>
          <div class="trend-fill" style="height:${h}%"></div>
          <div class="trend-label">${t.label}</div>
        </div>`;
      }).join('')}
    </div>

    <div class="section-title">Where the money's coming from</div>
    <div class="split-row">
      <div class="split-item">
        <div class="split-num">$${daycareRev.toLocaleString()}</div>
        <div class="split-label">Daycare · ${daycareBks.length} bookings</div>
      </div>
      <div class="split-item">
        <div class="split-num">$${boardingRev.toLocaleString()}</div>
        <div class="split-label">Boarding · ${boardingBks.length} nights</div>
      </div>
    </div>
    <div class="split-bar">
      <div class="split-day" style="width:${dayPct}%"></div>
      <div class="split-night" style="width:${100-dayPct}%"></div>
    </div>
    <p class="sub small muted text-center" style="margin-top:8px">Daycare ${dayPct}% · Boarding ${100-dayPct}%</p>

    <div class="section-title">Occupancy</div>
    <div class="occupancy-row">
      <div class="occupancy-item">
        <div class="occupancy-num">${dayOccupancy}<span class="pct">%</span></div>
        <div class="occupancy-label">Daycare · ${daycareBks.length}/${totalDaySlots} slots</div>
        <div class="cap-bar" style="width:100%; height:6px"><span style="width:${dayOccupancy}%"></span></div>
      </div>
      ${cap.maxBoarding ? `<div class="occupancy-item">

      </div>` : ''}
    </div>

    ${topClients.length ? `<div class="section-title">Top clients this ${ledgerPeriod === 'month' ? 'month' : ledgerPeriod}</div>` : ''}
    ${topClients.map(([id, rev]) => {
      const o = ownerById(id);
      const dogs = dogsOfOwner(id).map(d => d.name).join(', ');
      return `<div class="ledger-row" data-openowner="${id}">
        <div><div class="r-dog">${escapeHtml(o?.name || '?')}</div><div class="r-date">${escapeHtml(dogs) || '—'}</div></div>
        <div class="r-amt">$${rev.toLocaleString()}</div>
      </div>`;
    }).join('')}

    <div class="section-title">Owed to you
      <span class="pill owe" style="margin-left:auto">$${unpaidTotal.toLocaleString()}</span>
    </div>
    ${overdue30.length ? `<div class="aging-alert">⚠ ${overdue30.length} booking${overdue30.length===1?'':'s'} 30+ days overdue</div>` : overdue7.length ? `<div class="aging-alert soft">${overdue7.length} booking${overdue7.length===1?'':'s'} 7+ days overdue</div>` : ''}`;

  if (!unpaid.length) html += `<p class="sub muted">All paid up. Rare, isn't it?</p>`;
  unpaid.slice(0, 15).forEach(b => {
    const dog = dogById(b.dogId), owner = ownerOf(b.dogId);
    const days = Math.floor((now - new Date(b.date + 'T00:00:00')) / 86400000);
    const ageLabel = days > 30 ? `${days}d · overdue` : days > 7 ? `${days}d ago` : days > 0 ? `${days}d` : 'today';
    const ageClass = days > 30 ? 'age-bad' : days > 7 ? 'age-warn' : '';
    html += `<div class="ledger-row" data-openbk="${b.id}">
      <div><div class="r-dog">${escapeHtml(dog?.name || '?')}</div><div class="r-date">${escapeHtml(owner?.name || '—')} · ${fmtDateShort(b.date)} <span class="age-pill ${ageClass}">${ageLabel}</span></div></div>
      <div class="r-amt owe">$${b.total || 0}</div>
    </div>`;
  });

  html += `<div class="section-title">Recent payments</div>`;
  if (!recent.length) html += `<p class="sub muted">None yet.</p>`;
  recent.forEach(b => {
    const dog = dogById(b.dogId), owner = ownerOf(b.dogId);
    html += `<div class="ledger-row" data-openbk="${b.id}">
      <div><div class="r-dog">${escapeHtml(dog?.name || '?')}</div><div class="r-date">${escapeHtml(owner?.name || '—')} · ${fmtDateShort(b.date)}</div></div>
      <div class="r-amt">$${b.total || 0}</div>
    </div>`;
  });

  // Welcome packs section
  const packsInR = DB.packs.filter(p => p.purchaseDate >= localISO(R.start) && p.purchaseDate <= localISO(R.end));
  const packRev = packsInR.reduce((s,p) => s + (p.paidAmount||0), 0);
  const activePacks = DB.packs.filter(p => {
    const s = packSummary(p); return !s.expired && s.remaining > 0;
  });
  const activePacksTotal = activePacks.reduce((s,p) => s + (p.size - (p.daysUsed||0)), 0);
  if (DB.packs.length || packsInR.length) {
    html += `<div class="section-title">Welcome packs
      <span class="pill hi" style="margin-left:auto">${activePacks.length} active · ${activePacksTotal} days unused</span>
    </div>`;
    if (packRev > 0) {
      html += `<div class="split-item" style="margin-bottom:12px"><div class="split-num">$${packRev.toLocaleString()}</div><div class="split-label">Sold in ${R.label} · ${packsInR.length} pack${packsInR.length===1?'':'s'}</div></div>`;
    }
    if (activePacks.length) {
      activePacks.forEach(p => {
        const dog = dogById(p.dogId);
        const owner = ownerOf(p.dogId);
        const s = packSummary(p);
        const soon = s.expiresInDays <= 30;
        html += `<div class="ledger-row" data-opendog="${p.dogId}">
          <div><div class="r-dog">${escapeHtml(dog?.name || '?')} <span class="muted small">· ${p.size}-day pack</span></div><div class="r-date">${escapeHtml(owner?.name || '—')} · ${s.remaining} left ${soon ? '· <span class="text-owe">expires ' + s.expiresInDays + 'd</span>' : '· expires ' + fmtDateShort(p.expiryDate)}</div></div>
          <div class="r-amt">$${p.paidAmount}</div>
        </div>`;
      });
    }
  }

  html += `<div class="section-title">Take it away</div>
    <div style="display:flex; gap:8px; flex-wrap:wrap">
      <button class="btn ghost" onclick="exportLedgerCSV()">⬇ Export ${R.label} (CSV)</button>
      <button class="btn ghost" onclick="printLedger()">🖨 Printable statement</button>
    </div>`;

  return html;
}

function exportLedgerCSV() {
  const R = ledgerRange();
  const bks = DB.bookings.filter(b => b.date >= localISO(R.start) && b.date <= localISO(R.end)).sort((a,b) => a.date.localeCompare(b.date));
  const rows = [['Date','Dog','Owner','Session','Amount','Paid','Paid date']];
  bks.forEach(b => {
    const dog = dogById(b.dogId), owner = ownerOf(b.dogId);
    rows.push([b.date, dog?.name||'?', owner?.name||'—', SESSION_LABELS[b.session]||b.session, b.total||0, b.paymentStatus==='paid'?'yes':'no', b.paidAt ? b.paidAt.slice(0,10) : '']);
  });
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `pansis-ledger-${localISO(R.start)}-to-${localISO(R.end)}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  toast('CSV downloaded');
}

function updateBookingPrice() {
  const f = document.getElementById('bkForm');
  if (!f) return;
  const dog = dogById(f.dogId.value);
  if (!dog) { document.getElementById('priceNum').textContent = '$0'; document.getElementById('priceBreak').textContent = 'Pick a dog'; return; }
  const session = f.session.value;
  const base = PRICES[dog.size]?.[session] || 0;
  const parts = [`${SIZE_LABELS[dog.size]||dog.size} ${SESSION_LABELS[session]||session}: $${base}`];
  let total = base;
  if (f.senior.checked) { total += ADDONS.senior; parts.push(`+ Senior $${ADDONS.senior}`); }
  if (f.puppy.checked)  { total += ADDONS.puppy;  parts.push(`+ Puppy $${ADDONS.puppy}`); }
  if (f.med.checked)    { total += ADDONS.med;    parts.push(`+ Meds $${ADDONS.med}`); }
  if (f.diet.checked)   { total += ADDONS.diet;   parts.push(`+ Diet $${ADDONS.diet}`); }
  if (f.taxi.checked)   { total += ADDONS.taxi;   parts.push(`+ Taxi $${ADDONS.taxi}`); }
  if (f.ph.checked)     { total += SURCHARGES.publicHoliday; parts.push(`+ Public hol $${SURCHARGES.publicHoliday}`); }
  if (f.xmas.checked)   { const s = session==='overnight' ? SURCHARGES.xmasPeakNight : SURCHARGES.xmasPeakDay; total += s; parts.push(`+ Xmas $${s}`); }
  const customVal = f.customPrice.value;

  // Pack offer — show if the selected dog has active pack days AND session is a daycare session
  const packSlot = document.getElementById('packOfferSlot');
  if (packSlot && session !== 'overnight') {
    const activePacks = activePacksForDog(dog.id);
    if (activePacks.length) {
      const p = activePacks[0];
      const rem = p.size - (p.daysUsed || 0);
      const isChecked = f.usePack && f.usePack.checked;
      packSlot.innerHTML = `<label class="pack-toggle ${isChecked?'on':''}">
        <input type="checkbox" name="usePack" ${isChecked?'checked':''}>
        <div>
          <div class="pack-toggle-title">🎟 Redeem from ${p.size}-day pack</div>
          <div class="pack-toggle-meta">${rem} of ${p.size} days left · expires ${fmtDateShort(p.expiryDate)}</div>
        </div>
      </label>`;
    } else {
      packSlot.innerHTML = '';
    }
  } else if (packSlot) { packSlot.innerHTML = ''; }

  let displayTotal = total;
  let label = '';
  if (f.usePack && f.usePack.checked) {
    displayTotal = 0;
    label = `<span style="color:var(--night)">Redeemed from pack · normally $${total}</span>`;
  } else if (customVal !== '' && !isNaN(parseFloat(customVal))) {
    displayTotal = parseFloat(customVal);
    label = `<span class="text-owe">Custom (auto: $${total})</span>`;
  } else { label = parts.join(' '); }
  document.getElementById('priceNum').textContent = '$' + displayTotal;
  document.getElementById('priceBreak').innerHTML = label;
  updateRepeatPreview();
}

function toggleRepeatPreview(cb) {
  document.getElementById('repeatBody').classList.toggle('hidden', !cb.checked);
  updateRepeatPreview();
}
function updateRepeatPreview() {
  const f = document.getElementById('bkForm'); if (!f) return;
  const cb = f.repeat; if (!cb || !cb.checked) return;
  const startDate = f.date.value;
  const freq = parseInt(f.repeatFreq.value, 10);
  const weeks = parseInt(f.repeatWeeks.value, 10);
  const priceNum = parseFloat(document.getElementById('priceNum').textContent.replace(/[^\d.]/g,'')) || 0;
  const daysTotal = Math.ceil(weeks * 7 / freq);
  const totalRev = priceNum * daysTotal;
  const end = new Date(startDate + 'T00:00:00'); end.setDate(end.getDate() + (daysTotal-1) * freq);
  const preview = document.getElementById('repeatPreview');
  if (preview) preview.innerHTML = `<b>${daysTotal} bookings</b> · through ${fmtDateShort(localISO(end))} · <b>$${totalRev.toLocaleString()}</b> total`;
}
async function saveBookingForm(e, id, isNew) {
  e.preventDefault();
  if (savingBooking) return false;
  const f = e.target;
  const dog = dogById(f.dogId.value); if (!dog) return false;

  // Same dog, same day, same session is a duplicate, not a second visit.
  if (isNew) {
    const clash = DB.bookings.find(x =>
      x.dogId === f.dogId.value && x.date === f.date.value &&
      (x.session || 'full') === f.session.value);
    if (clash) {
      toast(dog.name + ' is already booked that day');
      return false;
    }
  }
  savingBooking = true;
  const submitBtn = f.querySelector('button[type="submit"]');
  if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = 'Saving…'; }
  try {
  const custom = f.customPrice.value === '' ? null : parseFloat(f.customPrice.value);
  const existing = isNew ? null : DB.bookings.find(b => b.id === id);
  const bk = {
    id, dogId: f.dogId.value, date: f.date.value, session: f.session.value,
    arrivalTime: f.arrivalTime.value, departureTime: f.departureTime.value,
    arrivalLogged: existing?.arrivalLogged || null, departureLogged: existing?.departureLogged || null,
    addOns: { senior: f.senior.checked, puppy: f.puppy.checked, med: f.med.checked, diet: f.diet.checked, taxi: f.taxi.checked },
    surcharges: { publicHoliday: f.ph.checked, xmas: false, xmasPeak: f.xmas.checked },
    customPrice: (custom != null && !isNaN(custom)) ? custom : null,
    total: 0, paymentStatus: f.paymentStatus.value, paidAt: existing?.paidAt || null,
    notes: f.notes.value, createdAt: existing?.createdAt || new Date().toISOString(),
    seriesId: existing?.seriesId, seriesPattern: existing?.seriesPattern,
    report: existing?.report || null
  };
  delete bk.surcharges.xmas;
  bk.total = calcTotal(bk, dog);

  // Pack redemption
  const usingPack = f.usePack && f.usePack.checked && bk.session !== 'overnight';
  if (usingPack) {
    const active = activePacksForDog(dog.id);
    const pack = active[0];
    if (pack) {
      // Was this booking previously redeemed against a different pack? Return that day.
      if (existing?.packId && existing.packId !== pack.id) {
        const oldPack = DB.packs.find(p => p.id === existing.packId);
        if (oldPack && oldPack.daysUsed > 0) oldPack.daysUsed -= 1;
      }
      // Only increment if this is a new redemption (not editing an existing one that was already redeemed on this pack)
      if (existing?.packId !== pack.id) pack.daysUsed = (pack.daysUsed || 0) + 1;
      bk.packId = pack.id;
      bk.total = 0;
      bk.customPrice = 0;
      bk.paymentStatus = 'paid';
      bk.paidAt = existing?.paidAt || new Date().toISOString();
      bk.notes = (bk.notes ? bk.notes + ' · ' : '') + `Redeemed from ${pack.size}-day pack`;
    }
  } else if (existing?.packId) {
    // Was redeemed, now unchecking — return the day to the pack
    const oldPack = DB.packs.find(p => p.id === existing.packId);
    if (oldPack && oldPack.daysUsed > 0) oldPack.daysUsed -= 1;
    bk.packId = null;
  }

  // Recurring bookings
  const wantRepeat = isNew && f.repeat && f.repeat.checked;
  if (wantRepeat) {
    const freq = parseInt(f.repeatFreq.value, 10);
    const weeks = parseInt(f.repeatWeeks.value, 10);
    const daysTotal = Math.ceil(weeks * 7 / freq);
    const seriesId = uid();
    const startDate = new Date(bk.date + 'T00:00:00');
    let added = 0, skipped = 0;
    for (let i = 0; i < daysTotal; i++) {
      const d = new Date(startDate); d.setDate(startDate.getDate() + i * freq);
      const iso = localISO(d);
      // skip if a booking already exists for this dog + date + session
      const dup = DB.bookings.find(x => x.dogId === bk.dogId && x.date === iso && (x.session||'full') === bk.session);
      if (dup) { skipped++; continue; }
      const clone = { ...bk, id: uid(), date: iso, seriesId, createdAt: new Date().toISOString(), report: null, arrivalLogged: null, departureLogged: null, paymentStatus: 'pending', paidAt: null };
      clone.surcharges = { ...bk.surcharges };
      clone.addOns = { ...bk.addOns };
      DB.bookings.push(clone);
      added++;
    }
    await save(DB); closeSheet(); render();
    toast(`${added} bookings added${skipped ? ' · ' + skipped + ' skipped (dupes)' : ''}`);
    return false;
  }

  if (isNew) {
    // Belt and braces: never allow the same id twice.
    if (!DB.bookings.some(x => x.id === bk.id)) DB.bookings.push(bk);
  } else {
    const i = DB.bookings.findIndex(x => x.id === id);
    if (i >= 0) DB.bookings[i] = bk;
  }
  await save(DB); closeSheet(); render();
  toast(isNew ? 'Booking added' : 'Saved');
  return false;
  } finally {
    savingBooking = false;
    if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = isNew ? 'Add booking' : 'Save'; }
  }
}
// --- Cancellation -----------------------------------------------------------
// 24h+ notice is free. Inside 24h is charged at 50% of what the day would have
// been. Weather or Andressa cancelling is always free — use the "no charge"
// option for that.
function cancelQuote(bk) {
  const dog = dogById(bk.dogId);
  const wouldHaveBeen = bk.customPrice != null ? bk.customPrice
    : ((bk.session === 'meet' || bk.session === 'trial') ? 0 : calcTotal({ ...bk, cancelled:false }, dog));
  const start = new Date(bk.date + 'T' + (bk.arrivalTime && bk.arrivalTime.length === 5 ? bk.arrivalTime : '07:30') + ':00');
  const hours = (start - new Date()) / 3600000;
  const late = hours < CANCEL_NOTICE_HOURS;
  return {
    wouldHaveBeen,
    hours,
    late,
    charge: late ? Math.round(wouldHaveBeen * CANCEL_CHARGE_RATE) : 0
  };
}

async function applyCancel(id, charge) {
  const bk = DB.bookings.find(b => b.id === id); if (!bk) return;
  bk.cancelled = true;
  bk.cancelledAt = new Date().toISOString();
  bk.cancelCharge = charge;
  bk.total = charge;
  bk.arrivalLogged = null;
  bk.departureLogged = null;
  // A cancelled day goes back to the pack.
  if (bk.packId) {
    const pk = DB.packs.find(x => x.id === bk.packId);
    if (pk && pk.daysUsed > 0) pk.daysUsed -= 1;
    bk.packId = null;
  }
  await save(DB); closeSheet(); render();
  toast(charge ? `Cancelled · $${charge} charged` : 'Cancelled · no charge');
}

async function uncancelBooking(id) {

}

  const price5 = calcPackPrice(d.size, 5);

  const today = todayISO();
  const expiry = new Date(); expiry.setMonth(expiry.getMonth() + 6);
  openSheet(`

    <form onsubmit="return savePackForm(event, '${dogId}')">

            <input type="radio" name="size" value="10" style="display:none">
            <div class="pack-option-body">
              <div class="pack-option-tier">10-day pack</div>
              <div class="pack-option-price">$${price10}</div>
              <div class="pack-option-unit">$${Math.round(price10/10)}/day · 15% off std $${base}</div>
            </div>
          </label>
        </div>
      </div>

      <button type="submit" class="btn primary block">Record pack</button>
    </form>
  `);
  // Wire pack option selection
  document.querySelectorAll('.pack-option').forEach(el => {
    const input = el.querySelector('input');
    const sync = () => {
      document.querySelectorAll('.pack-option').forEach(x => x.classList.toggle('on', x.querySelector('input').checked));
      const size = parseInt(el.querySelector('input').checked ? el.querySelector('input').value : 5, 10);
      const price = size === 5 ? price5 : price10;
      const paidInput = document.querySelector('input[name="paidAmount"]');
      if (paidInput && input.checked) paidInput.value = price;
    };
    input.addEventListener('change', sync);
    el.addEventListener('click', () => { input.checked = true; sync(); });
    if (input.checked) el.classList.add('on');
  });
}

    <label class="btn ghost block" style="cursor:pointer">
      ⚠ Replace all data <input type="file" accept="application/json" style="display:none" onchange="importDataFile(event, 'replace')">
    </label>`);

function importDataFile(e, mode) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = async ev => {
    try {
      const data = normalizeDb(JSON.parse(ev.target.result));
      if (mode === 'replace') {
        if (!confirm(`Replace all with ${data.owners.length} clients, ${data.dogs.length} dogs, ${data.bookings.length} bookings?`)) return;
        DB = data; await save(DB); closeSheet(); render();
        return;
      }
      const normPhone = p => (p || '').toString().replace(/\s+|-/g, '');
      const normName = n => (n || '').toString().trim().toLowerCase();
      let addOwner=0, mergeOwner=0, addDog=0, mergeDog=0, addBk=0, skipBk=0;
      const ownerIdMap = {};
      data.owners.forEach(newO => {
        const phone = normPhone(newO.phone);
        const existing = phone ? DB.owners.find(o => normPhone(o.phone) === phone) : DB.owners.find(o => normName(o.name) === normName(newO.name));
        if (existing) {
          ['email','address','notes','emergencyContact','source'].forEach(k => { if (!existing[k] && newO[k]) existing[k] = newO[k]; });
          ownerIdMap[newO.id] = existing.id; mergeOwner++;
        } else { DB.owners.push({...newO}); ownerIdMap[newO.id] = newO.id; addOwner++; }
      });
      const dogIdMap = {};
      data.dogs.forEach(newD => {
        const oid = ownerIdMap[newD.ownerId] || newD.ownerId;
        const existing = DB.dogs.find(d => d.ownerId === oid && normName(d.name) === normName(newD.name));
        if (existing) { Object.keys(newD).forEach(k => { if (k==='id'||k==='ownerId') return; if (!existing[k] && newD[k]) existing[k] = newD[k]; }); dogIdMap[newD.id] = existing.id; mergeDog++; }
        else { DB.dogs.push({...newD, ownerId: oid}); dogIdMap[newD.id] = newD.id; addDog++; }
      });
      data.bookings.forEach(newB => {
        const did = dogIdMap[newB.dogId] || newB.dogId;
        const exists = DB.bookings.find(b => b.dogId === did && b.date === newB.date && (b.session||'full') === (newB.session||'full'));
        if (exists) skipBk++; else { DB.bookings.push({...newB, dogId: did}); addBk++; }
      });
      await save(DB); closeSheet(); render();
      alert(`Merged.\nClients: +${addOwner} new, ${mergeOwner} merged\nDogs: +${addDog} new, ${mergeDog} merged\nBookings: +${addBk} new, ${skipBk} skipped`);
    } catch (err) { alert('Invalid file: ' + err.message); }
  };
  reader.readAsText(file);
}
function exportBackup() {
  const stamp = todayISO();
  const blob = new Blob([JSON.stringify(DB, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `pansis-backup-${stamp}.json`;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  DB.meta.lastBackup = new Date().toISOString(); save(DB);
  toast('Backup downloaded');
}

/* ---------- RITUAL ---------- */
const MOOD_WORDS = ['Playful','Chill','Napper','Adventurous','Bossy','Cuddly','Shy','Curious','Snuggly','Zoomy','Sleepy','Chatty'];
const MOMENT_CHIPS = ['Made a new friend','Napped hard','Big garden zoomies','Full meal','Half meal','Extra cuddles','First time with the pack','Had a swim','Chased a leaf','Went to the park','Slept on the couch','Got a hug at pickup'];

function ritualQueue() {
  const iso = todayISO();
  const arrivedToday = DB.bookings.filter(b => b.date === iso && b.arrivalLogged && !b.report?.sentAt);
  const overnights = DB.bookings.filter(b => b.session === 'overnight' && b.date === iso && !b.report?.sentAt);
  const combined = [...arrivedToday, ...overnights.filter(o => !arrivedToday.find(a => a.id === o.id))];
  return combined.sort((a,b) => (a.arrivalTime||'') > (b.arrivalTime||'') ? 1 : -1);
}
function startRitual() {
  const queue = ritualQueue();
  if (!queue.length) { toast('No dogs to report on'); return; }
  ritualState = {
    queueIds: queue.map(b => b.id),
    index: 0,
    sent: 0,
    sentIds: [],
    drafts: queue.reduce((m,b) => { m[b.id] = { mood: (b.report?.mood||[]).slice(), moments: (b.report?.moments||[]).slice(), story: b.report?.story||'', photos: (b.report?.photos || []).slice() }; return m; }, {})
  };
  renderRitual();
  document.getElementById('ritualOverlay').classList.add('on');
  document.body.classList.add('modal-open');
}
function closeRitual() {
  document.getElementById('ritualOverlay').classList.remove('on');
  document.body.classList.remove('modal-open');
  ritualState = null;
  drainPendingRemote();
}
function currentRitualBooking() {
  if (!ritualState) return null;
  const id = ritualState.queueIds[ritualState.index];
  return DB.bookings.find(b => b.id === id) || null;
}
function renderRitual() {
  if (!ritualState) return;
  const overlay = document.getElementById('ritualOverlay');
  const total = ritualState.queueIds.length;
  const index = ritualState.index;
  if (index >= total) return renderRitualClose();
  const b = currentRitualBooking();
  if (!b) { ritualState.index++; return renderRitual(); }
  const dog = dogById(b.dogId);
  const owner = ownerOf(b.dogId);
  const d = ritualState.drafts[b.id] || { mood:[], moments:[], story:'', photos:[] };
  const remaining = total - index - 1;
  const face = photoOrGlyph(dog);
  const heroPhoto = d.photos[0]?.data;

  overlay.innerHTML = `
    <div class="ritual-head">
      <div class="ritual-progress"><b>${index + 1}</b> of ${total}${remaining>0 ? ` · ${remaining} to go` : ' · last one'}</div>
      <button class="ritual-close" onclick="closeRitual()" aria-label="Close">×</button>
    </div>
    <div class="ritual-body">
      <div class="ritual-hero">
        <div class="ritual-hero-face">${heroPhoto ? `<img alt="${escapeHtml(dog?.name||'')}" src="${heroPhoto}">` : face}</div>
        <div>
          <div class="ritual-hero-name">${escapeHtml(dog?.name || '?')}</div>
          <div class="ritual-hero-meta">${escapeHtml(owner?.name || '—')} · ${SESSION_LABELS[b.session]} · $${b.total || calcTotal(b, dog)}</div>
        </div>
      </div>
      <div class="ritual-question">Photos from today</div>
      <div class="ritual-photo-grid">
        ${d.photos.map((p, i) => `<div class="ritual-photo-slot"><img alt="" src="${p.data}"><button class="rm" onclick="removeRitualPhoto(${i})" aria-label="Remove">×</button></div>`).join('')}
        ${d.photos.length < 4 ? `<label class="ritual-photo-slot add">＋<input type="file" accept="image/*" style="display:none" onchange="onRitualPhoto(event)"></label>` : ''}
      </div>
      <div class="ritual-question">How did the day feel?</div>
      <div class="chip-row">${MOOD_WORDS.map(w => `<div class="chip ${d.mood.includes(w)?'on':''}" onclick="toggleMood('${w}')">${w}</div>`).join('')}</div>
      <div class="ritual-question">Moments worth sharing</div>
      <div class="chip-row">${MOMENT_CHIPS.map(m => `<div class="chip ${d.moments.includes(m)?'on':''}" onclick="toggleMoment(${JSON.stringify(m).replace(/"/g,'&quot;')})">${escapeHtml(m)}</div>`).join('')}</div>
      <div class="ritual-question">Anything else for ${escapeHtml((owner?.name||'').split(' ')[0] || 'them')}?</div>
      <textarea class="ritual-notes" id="storyText" placeholder="Optional — a sentence or two.">${escapeHtml(d.story||'')}</textarea>
      <div class="ritual-question">Preview</div>
      ${renderReportPreview(b, dog, owner, d)}
    </div>
    <div class="ritual-foot">
      <button class="btn ghost" onclick="skipRitualCard()">Skip</button>
      <button class="btn primary" onclick="sendRitualCard()">Send${dog ? ' ' + escapeHtml(dog.name) : ''}'s report →</button>
    </div>`;
}
function renderReportPreview(b, dog, owner, d) {
  const moodLine = d.mood.length ? d.mood.join(' + ') : 'a good day';
  const storyLine = d.story ? d.story : (d.moments.length ? d.moments.slice(0,2).join(', then ') + '.' : '');
  const heroPhoto = d.photos[0]?.data;
  return `<div class="report-preview">
    <div class="rp-photo">${heroPhoto ? `<img alt="${escapeHtml(dog?.name||'')}" src="${heroPhoto}">` : '🐾'}</div>
    <div class="rp-body">
      <div class="rp-name">${escapeHtml(dog?.name || '?')}</div>
      <div class="rp-mood">${escapeHtml(moodLine)}</div>
      ${storyLine ? `<div class="rp-story">${escapeHtml(storyLine)}</div>` : ''}
      ${d.moments.length ? `<div class="rp-moments">${d.moments.map(m => `<span class="rp-moment">${escapeHtml(m)}</span>`).join('')}</div>` : ''}
      <div style="border-top:1px dashed var(--edge); padding-top:8px; text-align:left; font-size:12px; color:var(--ink-2)">
        <div style="display:flex; justify-content:space-between"><span>${fmtDateShort(b.date)} · ${SESSION_LABELS[b.session]}</span><span>$${b.total || 0}</span></div>
      </div>
    </div>
    <div class="rp-foot">Pansi's Paws · pansispaws.com.au</div>
  </div>`;
}
async function onRitualPhoto(e) {
  const file = e.target.files[0]; if (!file) return;
  captureRitualStory();
  try {
    const data = await downscalePhoto(file);
    const b = currentRitualBooking(); if (!b) return;
    ritualState.drafts[b.id].photos.push({ data, addedAt: new Date().toISOString() });
    renderRitual();
  } catch (err) { console.error(err); toast('Couldn\'t process photo'); }
}
function removeRitualPhoto(i) {
  captureRitualStory();
  const b = currentRitualBooking(); if (!b) return;
  ritualState.drafts[b.id].photos.splice(i, 1);
  renderRitual();
}
function captureRitualStory() {
  const el = document.getElementById('storyText');
  if (!el) return;
  const b = currentRitualBooking(); if (!b) return;
  ritualState.drafts[b.id].story = el.value;
}
function toggleMood(word) {
  captureRitualStory();
  const b = currentRitualBooking(); if (!b) return;
  const d = ritualState.drafts[b.id];
  const i = d.mood.indexOf(word);
  if (i >= 0) d.mood.splice(i, 1);
  else if (d.mood.length < 2) d.mood.push(word);
  else { d.mood.shift(); d.mood.push(word); }
  renderRitual();
}
function toggleMoment(m) {
  captureRitualStory();
  const b = currentRitualBooking(); if (!b) return;
  const d = ritualState.drafts[b.id];
  const i = d.moments.indexOf(m);
  if (i >= 0) d.moments.splice(i, 1); else d.moments.push(m);
  renderRitual();
}
function skipRitualCard() { ritualState.index++; renderRitual(); }
async function sendRitualCard() {
  const b = currentRitualBooking();
  if (!b) { ritualState.index++; return renderRitual(); }
  const dog = dogById(b.dogId);
  const owner = ownerOf(b.dogId);
  const d = ritualState.drafts[b.id];
  d.story = document.getElementById('storyText')?.value.trim() || d.story;

  // Re-look-up booking by id in case of sync
  const fresh = DB.bookings.find(x => x.id === b.id);
  if (!fresh) { toast('Booking gone — skipping'); ritualState.index++; return renderRitual(); }
  fresh.report = { mood: d.mood, moments: d.moments, story: d.story, photos: d.photos, sentAt: new Date().toISOString() };
  try { await save(DB); } catch (e) { console.warn(e); toast('Save failed — continuing'); }

  if (dog) {
    try { generateInvoicePDF(fresh, dog, owner); } catch (e) { console.warn('PDF failed', e); }
    if (owner?.email) {
      const body = buildRitualEmail(d, dog, owner, fresh);
      const subject = `${dog.name}'s day at Pansi's Paws`;
      window.location.href = `mailto:${owner.email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
      toast('PDF downloaded — attach it before sending', 'info');
    } else {
      toast(`${dog.name}: no email on file — PDF in Downloads`);
    }
  }

  ritualState.sent++;
  ritualState.sentIds.push(b.id);
  hapticSuccess();
  toast(`Sent ${dog?.name || 'report'}`);
  ritualState.index++;
  renderRitual();
}
function renderRitualClose() {
  const overlay = document.getElementById('ritualOverlay');
  const sent = ritualState.sent;
  const total = ritualState.queueIds.length;
  const sentBookings = ritualState.sentIds.map(id => DB.bookings.find(b => b.id === id)).filter(Boolean);
  const takings = sentBookings.reduce((s,b) => s + (b.total||0), 0);
  const allMoods = sentBookings.map(b => (b.report?.mood || [])[0]).filter(Boolean);
  const counts = {};
  allMoods.forEach(m => counts[m] = (counts[m]||0) + 1);
  const dominantMood = Object.keys(counts).sort((a,b) => counts[b]-counts[a])[0];
  const dominantLine = dominantMood ? `Mostly a ${dominantMood.toLowerCase()} day.` : '';
  const thumbs = sentBookings.map(b => {
    const dog = dogById(b.dogId);
    const p = b.report?.photos?.[0]?.data;
    if (!p) return '';
    return `<div class="close-thumb"><img alt="${escapeHtml(dog?.name||'')}" src="${p}"><div class="caption">${escapeHtml(dog?.name||'')}</div></div>`;
  }).join('');

  overlay.innerHTML = `
    <div class="ritual-head">
      <div class="ritual-progress"><b>Day closed.</b></div>
      <button class="ritual-close" onclick="closeRitual()" aria-label="Close">×</button>
    </div>
    <div class="ritual-body">
      <div class="close-page">
        <div class="close-headline">${sent === 0 ? 'Nothing sent today.' : sent === 1 ? 'One story sent.' : `${sent} stories sent.`}</div>
        ${dominantLine ? `<div class="close-mood">${escapeHtml(dominantLine)}</div>` : ''}
        ${thumbs ? `<div class="close-collage">${thumbs}</div>` : ''}
        <div class="close-stats">
          <div class="close-stat"><b>$${takings.toLocaleString()}</b> takings</div>
          <div class="close-stat"><b>${sent}</b>/${total} reports</div>
        </div>
        <p class="sub muted small">Well done. Sleep well.</p>
      </div>
    </div>
    <div class="ritual-foot">
      <button class="btn primary block big" onclick="closeRitual()">Close the daybook</button>
    </div>`;
  render();
}

function buildRitualEmail(d, dog, owner, booking) {
  const firstName = (owner?.name || '').split(' ')[0] || 'there';
  const moodLine = d.mood.length ? d.mood.join(' + ') : 'a good day';
  const momentsLine = d.moments.length ? '\n\n' + d.moments.map(m => '• ' + m).join('\n') : '';
  const storyLine = d.story ? `\n\n${d.story}` : '';
  return `Hi ${firstName},

${dog.name}'s day was ${moodLine.toLowerCase()}.${momentsLine}${storyLine}

Today's invoice ($${booking.total}) is attached. Bank details are on the invoice.

Andressa
Pansi's Paws — Home Dog Daycare
Annandale`;
}

  pdf.save(`invoice-${(dog?.name || 'dog').replace(/\W+/g,'')}-${booking.date}.pdf`);
}

function photoOrGlyph(dog) {
  if (dog?.photoUrl) return `<img alt="${escapeHtml(dog.name||'')}" src="${escapeHtml(dog.photoUrl)}">`;
  const glyphs = ['🐕','🐶','🦮','🐕‍🦺'];
  const idx = (dog?.name || '').split('').reduce((s,c) => s + c.charCodeAt(0), 0) % glyphs.length;
  return glyphs[idx];
}
