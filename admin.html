// ----- Client (Owner + Dogs) modal -----
function openClientModal(ownerId) {
  const owner = ownerId ? ownerById(ownerId) : null;
  const isNew = !owner;
  const o = owner || { id: uid(), name: '', phone: '', email: '', address: '', notes: '', emergencyContact: '' };
  const dogs = owner ? dogsOfOwner(owner.id) : [];

  const flagPills = (d) => {
    const pills = [];
    if (isMeaningfulHealth(d.medicalConditions)) pills.push('<span class="pill overdue">⚕ medical</span>');
    if (isMeaningfulHealth(d.allergies)) pills.push('<span class="pill pending">⚠ allergy</span>');
    if (d.aggression === 'yes') pills.push('<span class="pill overdue">⚠ aggression</span>');
    if (d.vaccinated === 'no' || !d.vaccinated) pills.push('<span class="pill pending">vacc?</span>');
    return pills.join(' ');
  };

  const truncate = (s, n=80) => !s ? '' : (s.length > n ? s.slice(0, n) + '…' : s);
  const dogRows = dogs.map((d) => {
    const bits = [SIZE_LABELS[d.size] || d.size, d.breed, d.sex, d.age, d.weight ? d.weight + 'kg' : null].filter(Boolean).join(' · ');
    const sections = [];
    if (d.vaccinated || d.vaccDate || d.vaccinationExpiry) {
      sections.push(`<div class="tiny" style="margin-top:0.5rem;"><strong style="color:var(--choc);">💉 Vacc:</strong> ${d.vaccinated || '?'} ${d.vaccDate ? '(' + d.vaccDate + ')' : ''} ${d.vetName ? ' · vet: ' + d.vetName : ''}</div>`);
    }
    if (isMeaningfulHealth(d.medicalConditions) || isMeaningfulHealth(d.allergies)) {
      sections.push(`<div class="tiny" style="margin-top:0.3rem; color:var(--red);"><strong>⚕ Health:</strong> ${[isMeaningfulHealth(d.medicalConditions) && d.medicalConditions, isMeaningfulHealth(d.allergies) && 'Allergies: ' + d.allergies].filter(Boolean).join(' · ')}</div>`);
    }
    if (d.feedingSchedule) {
      sections.push(`<div class="tiny" style="margin-top:0.3rem;"><strong style="color:var(--choc);">🍽 Feeding:</strong> ${truncate(d.feedingSchedule, 100)}</div>`);
    }
    if (d.aggression === 'yes' || d.separation === 'yes' || d.friendlyDogs === 'no') {
      const flags = [];
      if (d.aggression === 'yes') flags.push('aggression');
      if (d.separation === 'yes') flags.push('separation anxiety');
      if (d.friendlyDogs === 'no') flags.push('not dog-friendly');
      sections.push(`<div class="tiny" style="margin-top:0.3rem; color:var(--red);"><strong>🐕 Behaviour flags:</strong> ${flags.join(', ')}</div>`);
    }
    if (d.additionalBehaviours) {
      sections.push(`<div class="tiny" style="margin-top:0.3rem;"><strong style="color:var(--choc);">📝 Owner notes:</strong> ${truncate(d.additionalBehaviours, 140)}</div>`);
    }
    return `
    <div class="card">
      <div class="row between">
        <div class="grow">
          <div class="bold">${d.name}</div>
          <div class="muted tiny mt-1">${bits}</div>
          <div class="row gap-1 mt-1">${flagPills(d)}</div>
          ${sections.join('')}
        </div>
        <div style="display:flex; flex-direction:column; gap:0.3rem; min-width: 60px;">
          <button class="btn tiny" onclick="openDogModal('${d.id}', '${o.id}')">Edit</button>
          <button class="btn tiny danger" onclick="deleteDog('${d.id}')">×</button>
        </div>
      </div>
    </div>`;
  }).join('');

  showModal(`
    <h2>${isNew ? 'New client' : 'Edit client'} <button class="close-x" onclick="hideModal()">×</button></h2>
    <form id="ownerForm" class="form-grid" onsubmit="saveOwner(event, '${o.id}', ${isNew})">
      <label><span>Owner name</span><input name="name" value="${o.name}" required></label>
      <div class="two">
        <label><span>Phone</span><input name="phone" value="${o.phone}" type="tel"></label>
        <label><span>Email</span><input name="email" value="${o.email}" type="email"></label>
      </div>
      <label><span>Emergency contact</span><input name="emergencyContact" value="${o.emergencyContact || ''}" placeholder="Name &amp; phone (someone not travelling with you)"></label>
      <label><span>Address (optional)</span><input name="address" value="${o.address}"></label>
      <label><span>Notes</span><textarea name="notes" rows="2">${o.notes}</textarea></label>
      <button class="btn primary block" type="submit">${isNew ? 'Add client' : 'Save changes'}</button>
    </form>
    ${!isNew ? `
      <h3 style="margin: 1.5rem 0 0.6rem; color: var(--choc);">Dogs</h3>
      ${dogRows || '<div class="muted tiny">No dogs yet</div>'}
      <button class="btn block mt-1" onclick="openDogModal(null, '${o.id}')">+ Add a dog</button>
      <button class="btn danger block mt-2" onclick="deleteOwner('${o.id}')">Delete client</button>
    ` : ''}
  `);
}
function saveOwner(e, id, isNew) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const owner = {
    id, name: fd.get('name').trim(), phone: fd.get('phone').trim(),
    email: fd.get('email').trim(), address: fd.get('address').trim(),
    notes: fd.get('notes').trim(),
    emergencyContact: (fd.get('emergencyContact') || '').toString().trim(),
    createdAt: new Date().toISOString()
  };
  if (isNew) DB.owners.push(owner);
  else {
    const idx = DB.owners.findIndex(o => o.id === id);
    DB.owners[idx] = { ...DB.owners[idx], ...owner };
  }
  save(DB);
  if (isNew) {
    hideModal();
    openClientModal(id); // re-open to allow adding dogs
  } else {
    hideModal(); render();
  }
}
function deleteOwner(id) {
  if (!confirm('Delete this client and all their dogs? Bookings will remain.')) return;
  DB.owners = DB.owners.filter(o => o.id !== id);
  DB.dogs = DB.dogs.filter(d => d.ownerId !== id);
  save(DB); hideModal(); render();
}

function saveDog(e, id, ownerId, isNew) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const existing = isNew ? null : dogById(id);
  const get = (k) => (fd.get(k) || '').toString().trim();
  const dog = {
    id, ownerId,
    name: get('name'),
    size: get('size'),
    age: get('age'),
    breed: get('breed'),
    sex: get('sex'),
    weight: get('weight'),
    vaccinationExpiry: get('vacc'),
    vaccDate: get('vaccDate'),
    vaccinated: get('vaccinated'),
    fleaTick: get('fleaTick'),
    vetName: get('vetName'),
    vaccCertUrl: existing?.vaccCertUrl || '',
    desexCertUrl: existing?.desexCertUrl || '',
    medicalConditions: get('medicalConditions'),
    allergies: get('allergies'),
    friendlyDogs: get('friendlyDogs'),
    aggression: get('aggression'),
    aggressionExplain: get('aggressionExplain'),
    separation: get('separation'),
    toiletRoutine: get('toiletRoutine'),
    additionalBehaviours: get('additionalBehaviours'),
    feedingSchedule: get('feedingSchedule'),
    treatsConsent: get('treatsConsent'),
    photoConsent: get('photoConsent'),
    agreementSig: existing?.agreementSig || '',
    agreementDate: existing?.agreementDate || '',
    notes: get('notes')
  };
  if (isNew) DB.dogs.push(dog);
  else {
    const idx = DB.dogs.findIndex(x => x.id === id);
    DB.dogs[idx] = { ...DB.dogs[idx], ...dog };
  }
  save(DB);
  hideModal();
  openClientModal(ownerId);
}
function deleteDog(id) {
  if (!confirm('Delete this dog?')) return;
  const dog = dogById(id);
  const ownerId = dog?.ownerId;
  DB.dogs = DB.dogs.filter(d => d.id !== id);

}

function recalc() {
  const f = document.getElementById('bookingForm');
  if (!f) return;
  const dogId = f.dogId.value;
  const dog = dogById(dogId);
  const session = f.session.value;
  const date = f.date.value;

  if (!dog) {
    document.getElementById('priceTotal').textContent = '$0';
    document.getElementById('priceBreakdown').textContent = 'Pick a dog';
    return;
  }

  let base = PRICES[dog.size][session];
  let breakdown = [`Base $${base}`];
  let total = base;

  if (f.senior.checked) { total += ADDONS.senior; breakdown.push(`Senior +$${ADDONS.senior}`); }
  if (f.puppy && f.puppy.checked) { total += ADDONS.puppy; breakdown.push(`Puppy +$${ADDONS.puppy}`); }
  if (f.med.checked)    { total += ADDONS.med;    breakdown.push(`Med +$${ADDONS.med}`); }
  if (f.diet.checked)   { total += ADDONS.diet;   breakdown.push(`Diet +$${ADDONS.diet}`); }
  if (f.taxi.checked)   { total += ADDONS.taxi;   breakdown.push(`Taxi +$${ADDONS.taxi}`); }
  if (f.ph.checked)     { total += SURCHARGES.publicHoliday; breakdown.push(`Pub hol +$${SURCHARGES.publicHoliday}`); }
  if (f.xmas.checked || (date && isXmasPeak(date))) {
    if (!f.xmas.checked && isXmasPeak(date)) { f.xmas.checked = true; }
    const xs = session === 'overnight' ? SURCHARGES.xmasPeakNight : SURCHARGES.xmasPeakDay;
    total += xs;
    breakdown.push(`Xmas peak +$${xs}`);
  }
  const customRaw = f.customPrice ? f.customPrice.value : '';
  const custom = customRaw === '' ? null : parseFloat(customRaw);
  if (custom !== null && !isNaN(custom)) {
    document.getElementById('priceTotal').textContent = '$' + custom;
    document.getElementById('priceBreakdown').textContent = `Custom price (auto-calc was $${total})`;
    return;
  }

  document.getElementById('priceTotal').textContent = '$' + total;
  document.getElementById('priceBreakdown').textContent = breakdown.join(' · ');
}

function saveBooking(e, id, isNew) {
  e.preventDefault();
  const f = e.target;
  const dog = dogById(f.dogId.value);
  if (!dog) return;
  const session = f.session.value;
  const date = f.date.value;

  let base = PRICES[dog.size][session];
  let total = base;
  if (f.senior.checked) total += ADDONS.senior;
  if (f.puppy && f.puppy.checked) total += ADDONS.puppy;
  if (f.med.checked) total += ADDONS.med;
  if (f.diet.checked) total += ADDONS.diet;
  if (f.taxi.checked) total += ADDONS.taxi;
  if (f.ph.checked) total += SURCHARGES.publicHoliday;
  if (f.xmas.checked) total += (session === 'overnight' ? SURCHARGES.xmasPeakNight : SURCHARGES.xmasPeakDay);
  const customRaw = f.customPrice ? f.customPrice.value : '';
  const customPrice = customRaw === '' ? null : parseFloat(customRaw);
  if (customPrice !== null && !isNaN(customPrice)) total = customPrice;

  const existing = isNew ? null : DB.bookings.find(b => b.id === id);

  const bk = {
    id, dogId: f.dogId.value, date, session,
    arrivalTime: f.arrivalTime.value,
    departureTime: f.departureTime.value,
    arrivalLogged: existing?.arrivalLogged || null,
    departureLogged: existing?.departureLogged || null,
    addOns: {
      senior: f.senior.checked,
      puppy: f.puppy ? f.puppy.checked : false,
      med: f.med.checked,
      diet: f.diet.checked, taxi: f.taxi.checked
    },
    surcharges: { publicHoliday: f.ph.checked, xmasPeak: f.xmas.checked },
    customPrice: (customPrice !== null && !isNaN(customPrice)) ? customPrice : null,
    total, paymentStatus: f.paymentStatus.value,
    paidAt: f.paymentStatus.value === 'paid' ? (existing?.paidAt || new Date().toISOString()) : null,
    notes: f.notes.value.trim(),
    createdAt: existing?.createdAt || new Date().toISOString()
  };

  if (isNew) DB.bookings.push(bk);
  else {
    const idx = DB.bookings.findIndex(x => x.id === id);
    DB.bookings[idx] = bk;
  }
  save(DB); hideModal(); render();
}

function deleteBooking(id) {
  if (!confirm('Delete this booking?')) return;
  DB.bookings = DB.bookings.filter(b => b.id !== id);
  save(DB); hideModal(); render();
}

function cancelSeries(seriesId) {
  const inSeries = DB.bookings.filter(b => b.seriesId === seriesId);
  if (!inSeries.length) return;
  const futureOnly = confirm(`This series has ${inSeries.length} bookings.\n\nClick OK to delete FUTURE bookings only (keeps past ones).\nClick Cancel to keep all bookings as-is.`);
  if (!futureOnly) return;
  const today = todayISO();
  const before = DB.bookings.length;
  DB.bookings = DB.bookings.filter(b => !(b.seriesId === seriesId && b.date >= today));
  save(DB); hideModal(); render();
  alert(`Cancelled ${before - DB.bookings.length} future bookings in this series.`);
}

function updateRecurPreview() {
  const f = document.getElementById('recurForm');
  if (!f) return;
  const dog = dogById(f.dogId.value);
  if (!dog) {
    document.getElementById('recurPreview').innerHTML = '<span class="muted tiny">Pick a dog…</span>';
    return;
  }
  const selectedDays = [0,1,2,3,4,5,6].filter(i => f['dow' + i].checked);
  if (!selectedDays.length) {
    document.getElementById('recurPreview').innerHTML = '<span class="muted tiny">Pick at least one weekday…</span>';
    return;
  }
  const start = new Date(f.start.value + 'T00:00:00');
  const end   = new Date(f.end.value + 'T00:00:00');
  if (!(start <= end)) {
    document.getElementById('recurPreview').innerHTML = '<span class="muted tiny" style="color:var(--red);">End date must be on or after start.</span>';
    return;
  }

  const dates = [];
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
    const jsDow = d.getDay(); // 0 = Sun
    const monFirstDow = (jsDow + 6) % 7; // 0 = Mon
    if (selectedDays.includes(monFirstDow)) {
      dates.push(d.toISOString().slice(0,10));
    }
  }

  const session = f.session.value;
  const baseRate = PRICES[dog.size][session];
  const customRaw = f.customPrice ? f.customPrice.value : '';
  const customPrice = customRaw === '' ? null : parseFloat(customRaw);
  const perBooking = (customPrice !== null && !isNaN(customPrice)) ? customPrice : baseRate;
  let xmasCount = 0;
  let totalIncXmas = 0;
  dates.forEach(d => {
    let bk = perBooking;
    if (isXmasPeak(d)) {
      xmasCount++;
      bk += (session === 'overnight' ? SURCHARGES.xmasPeakNight : SURCHARGES.xmasPeakDay);
    }
    totalIncXmas += bk;
  });

  const dayLabels = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const priceNote = (customPrice !== null && !isNaN(customPrice))
    ? `$${perBooking} custom (std $${baseRate})`
    : `$${baseRate}`;
  document.getElementById('recurPreview').innerHTML = `
    <div class="bold">${dog.name} · ${SESSION_LABELS[session]} · ${selectedDays.map(i => dayLabels[i]).join(', ')}</div>
    <div class="muted tiny mt-1">${dates.length} bookings · ${priceNote}${xmasCount ? ' · ' + xmasCount + ' on Xmas peak (+surcharge)' : ''}</div>
    <div class="bold mt-1" style="color:var(--choc);">Total: $${totalIncXmas}</div>
  `;
}

function generateRecurring(e) {
  e.preventDefault();
  const f = e.target;
  const dog = dogById(f.dogId.value);
  if (!dog) return;
  const selectedDays = [0,1,2,3,4,5,6].filter(i => f['dow' + i].checked);
  if (!selectedDays.length) { alert('Pick at least one day of the week.'); return; }

  const start = new Date(f.start.value + 'T00:00:00');
  const end   = new Date(f.end.value + 'T00:00:00');
  if (!(start <= end)) { alert('End date must be on or after start.'); return; }

  const session = f.session.value;
  const baseRate = PRICES[dog.size][session];
  const customRaw = f.customPrice ? f.customPrice.value : '';
  const customPrice = customRaw === '' ? null : parseFloat(customRaw);
  const notes = (f.notes.value || '').trim();

  const seriesId = uid();
  const dayLabels = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const seriesPattern = `${dayLabels.filter((_, i) => selectedDays.includes(i)).join('+')} · ${SESSION_LABELS[session]}`;

  let created = 0, skipped = 0;
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
    const jsDow = d.getDay();
    const monFirstDow = (jsDow + 6) % 7;
    if (!selectedDays.includes(monFirstDow)) continue;
    const iso = d.toISOString().slice(0,10);

    // Skip if a booking already exists for this dog + date
    const dup = DB.bookings.find(b => b.dogId === dog.id && b.date === iso);
    if (dup) { skipped++; continue; }

    let total = baseRate;
    const isPeak = isXmasPeak(iso);
    if (isPeak) total += (session === 'overnight' ? SURCHARGES.xmasPeakNight : SURCHARGES.xmasPeakDay);
    if (customPrice !== null && !isNaN(customPrice)) total = customPrice + (isPeak ? (session === 'overnight' ? SURCHARGES.xmasPeakNight : SURCHARGES.xmasPeakDay) : 0);

    DB.bookings.push({
      id: uid(),
      dogId: dog.id,
      date: iso,
      session,
      arrivalTime: '', departureTime: '',
      arrivalLogged: null, departureLogged: null,
      addOns: { senior: false, puppy: false, med: false, diet: false, taxi: false },
      surcharges: { publicHoliday: false, xmasPeak: isPeak },
      customPrice: (customPrice !== null && !isNaN(customPrice)) ? customPrice : null,
      total,
      paymentStatus: 'pending',
      paidAt: null,
      notes,
      seriesId,
      seriesPattern,
      createdAt: new Date().toISOString()
    });
    created++;
  }

  save(DB);
  hideModal();
  render();
  alert(`✓ Created ${created} bookings${skipped ? ' (skipped ' + skipped + ' that already existed)' : ''}.`);
}

function fieldFromText(text, ...keys) {
  // Try to find "Key: value" in pasted email
  for (const k of keys) {
    const re = new RegExp('(?:^|\\n)\\s*' + k.replace(/[-\\s_]/g, '[\\s_-]?') + '[\\s_:]*:?\\s*([^\\n]+)', 'i');
    const m = text.match(re);
    if (m) return m[1].trim();
  }
  return '';
}

function normalizeSize(s) {
  if (!s) return 'medium';
  const v = s.toLowerCase();
  if (v.includes('small') || v.includes('10') && v.includes('≤')) return 'small';
  if (v.includes('large') || v.includes('25+') || v.includes('kg+')) return 'large';
  return 'medium';
}

function normalizeSession(s) {
  if (!s) return 'full';
  const v = s.toLowerCase();
  if (v.includes('half')) return 'half';
  if (v.includes('extended')) return 'extended';
  if (v.includes('overnight') || v.includes('boarding') || v.includes('night')) return 'overnight';
  return 'full';
}

function parsePaste() {
  const text = document.getElementById('impPaste').value;
  if (!text.trim()) return;

  // Try to extract a single record from the pasted text
  const record = {
    ownerName: fieldFromText(text, 'ownerName', 'owner name', 'name'),
    ownerPhone: fieldFromText(text, 'ownerPhone', 'phone', 'owner phone', 'mobile'),
    ownerEmail: fieldFromText(text, 'ownerEmail', 'email', 'owner email'),
    dogName: fieldFromText(text, 'dogName', 'dog name', 'dog'),
    size: fieldFromText(text, 'size', 'dog size', 'weight'),
    session: fieldFromText(text, 'session', 'service'),
    date: fieldFromText(text, 'date', 'booking date', 'preferred date'),
    breed: fieldFromText(text, 'breed'),
    age: fieldFromText(text, 'age'),
    notes: fieldFromText(text, 'notes', 'message', 'comments'),
    medicalConditions: fieldFromText(text, 'medicalConditions', 'medical conditions', 'medical'),
    allergies: fieldFromText(text, 'allergies'),
    source: 'paste'
  };

  if (!record.ownerName && !record.ownerPhone && !record.dogName) {
    alert('Could not find any recognisable fields. Make sure the pasted text has "Name:", "Phone:", "Dog:" etc. on separate lines.');
    return;
  }

  showImportPreview([record]);
}

function parseCSV(ev) {
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const records = csvToRecords(e.target.result);
      if (!records.length) { alert('No rows found in CSV.'); return; }
      showImportPreview(records);
    } catch (err) {
      alert('Could not parse CSV: ' + err.message);
    }
  };
  reader.readAsText(file);
}

// Minimal CSV parser (handles quoted fields with commas)
function csvToRecords(csv) {
  const lines = csv.replace(/\r/g, '').split('\n').filter(l => l.trim());
  if (lines.length < 2) return [];
  const parseLine = (line) => {
    const out = []; let cur = ''; let inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"' && line[i+1] === '"') { cur += '"'; i++; }
      else if (c === '"') inQ = !inQ;
      else if (c === ',' && !inQ) { out.push(cur); cur = ''; }
      else cur += c;
    }
    out.push(cur);
    return out;
  };
  const headers = parseLine(lines[0]).map(h => h.trim());
  return lines.slice(1).map(line => {
    const cells = parseLine(line);
    const row = {};
    headers.forEach((h, i) => row[h] = (cells[i] || '').trim());
    return {
      ownerName: row.ownerName || row.name || '',
      ownerPhone: row.ownerPhone || row.phone || '',
      ownerEmail: row.ownerEmail || row.email || '',
      dogName: row.dogName || row.dog || '',
      size: row.size || row.weight || '',
      session: row.session || row.service || '',
      date: row.date || '',
      breed: row.breed || '',
      age: row.age || '',
      notes: row.notes || row.message || '',
      medicalConditions: row.medicalConditions || row.medical || '',
      allergies: row.allergies || '',
      source: 'csv'
    };
  }).filter(r => r.ownerName || r.dogName);
}

function showImportPreview(records) {
  const existing = new Set(DB.owners.map(o => (o.phone || '').replace(/\s+/g, '')));
  const rows = records.map((r, i) => {
    const phoneNorm = r.ownerPhone.replace(/\s+/g, '');
    const isDup = phoneNorm && existing.has(phoneNorm);
    const sizeNorm = normalizeSize(r.size);
    const sessNorm = normalizeSession(r.session);
    return `
      <div class="card" style="${isDup ? 'opacity:0.5;' : ''}">
        <div class="row between">
          <div>
            <div class="bold">${r.ownerName || '(no name)'} ${isDup ? '<span class="pill overdue">DUP</span>' : ''}</div>
            <div class="muted tiny">${r.ownerPhone || ''} ${r.ownerEmail ? '· ' + r.ownerEmail : ''}</div>
            <div class="muted tiny">🐶 ${r.dogName || '?'} · ${sizeNorm}${r.breed ? ' · ' + r.breed : ''}</div>
            ${r.date ? `<div class="muted tiny">📅 ${r.date} · ${sessNorm}</div>` : ''}
            ${r.medicalConditions ? `<div class="muted tiny">⚕ ${r.medicalConditions}</div>` : ''}
          </div>
          <label class="row gap-1">
            <input type="checkbox" id="imp-${i}" ${isDup ? '' : 'checked'}>
            <span class="tiny bold">Import</span>
          </label>
        </div>
      </div>`;
  }).join('');

  window._pendingImport = records;
  document.getElementById('importPreview').innerHTML = `
    <h3 style="color:var(--choc); margin: 1rem 0 0.5rem;">Preview (${records.length})</h3>
    <p class="muted tiny">Untick any you don't want. "DUP" = phone already exists in your clients.</p>
    ${rows}
    <button class="btn primary block mt-2" onclick="confirmImport()">Import selected</button>
  `;
}

function confirmImport() {
  const records = window._pendingImport || [];
  let added = 0;
  records.forEach((r, i) => {
    const cb = document.getElementById('imp-' + i);
    if (!cb || !cb.checked) return;

    // Create owner
    const ownerId = uid();
    DB.owners.push({
      id: ownerId,
      name: r.ownerName || '(Unknown)',
      phone: r.ownerPhone || '',
      email: r.ownerEmail || '',
      address: '',
      notes: [r.medicalConditions, r.allergies, r.notes].filter(Boolean).join(' · '),
      createdAt: new Date().toISOString(),
      source: 'formspree'
    });

    // Create dog
    if (r.dogName) {
      const dogId = uid();
      DB.dogs.push({
        id: dogId,
        ownerId,
        name: r.dogName,
        size: normalizeSize(r.size),
        age: r.age || '',
        vaccinationExpiry: '',
        notes: [r.breed, r.medicalConditions, r.allergies].filter(Boolean).join(' · ')
      });

      // If date present, create a pending booking
      if (r.date && /^\d{4}-\d{2}-\d{2}$/.test(r.date)) {
        const session = normalizeSession(r.session);
        const base = PRICES[normalizeSize(r.size)][session];
        DB.bookings.push({
          id: uid(),
          dogId,
          date: r.date,
          session,
          arrivalTime: '', departureTime: '',
          arrivalLogged: null, departureLogged: null,
          addOns: { senior: false, med: false, diet: false, taxi: false },
          surcharges: { publicHoliday: false, xmasPeak: isXmasPeak(r.date) },
          discountPct: 0,
          total: base + (isXmasPeak(r.date) ? (session === 'overnight' ? SURCHARGES.xmasPeakNight : SURCHARGES.xmasPeakDay) : 0),
          paymentStatus: 'pending',
          paidAt: null,
          notes: r.notes || '',
          createdAt: new Date().toISOString()
        });
      }
    }
    added++;
  });
  save(DB);
  hideModal();
  render();
  alert(`Imported ${added} client(s).`);

// ===== BACKUP =====
function exportData() {
  const data = JSON.stringify(DB, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const date = todayISO();
  a.href = url;
  a.download = `pansis-admin-backup-${date}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  DB.meta.lastBackup = new Date().toISOString();
  save(DB); render();
}
function importData(e, mode) {
  mode = mode || 'replace';
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!data.owners || !data.dogs || !data.bookings) throw new Error('bad shape');

      if (mode === 'replace') {
        if (!confirm(`REPLACE all current data with the backup?\n\n• ${data.owners.length} clients\n• ${data.dogs.length} dogs\n• ${data.bookings.length} bookings\n\nCurrent data will be lost.`)) return;
        DB = data;
        save(DB); render();
        alert('Restored.');
        return;
      }

      // MERGE mode — dedupe owners by phone, dogs by (ownerId, name), bookings by (dogId, date, session)
      const normPhone = p => (p || '').replace(/\s+|-/g, '');
      const normName  = n => (n || '').trim().toLowerCase();

      let addedOwners = 0, mergedOwners = 0;
      let addedDogs = 0, mergedDogs = 0;
      let addedBookings = 0, skippedBookings = 0;

      // Map of incoming ownerId -> existing/created ownerId (so we can remap dogs+bookings)
      const ownerIdMap = {};

      data.owners.forEach(newO => {
        const phone = normPhone(newO.phone);
        const existing = phone
          ? DB.owners.find(o => normPhone(o.phone) === phone)
          : DB.owners.find(o => normName(o.name) === normName(newO.name));

        if (existing) {
          // Merge — prefer existing non-empty fields, fill in any blanks from new
          ['email','address','notes','emergencyContact','source'].forEach(k => {
            if (!existing[k] && newO[k]) existing[k] = newO[k];
          });
          ownerIdMap[newO.id] = existing.id;
          mergedOwners++;
        } else {
          DB.owners.push({ ...newO });
          ownerIdMap[newO.id] = newO.id;
          addedOwners++;
        }
      });

      data.dogs.forEach(newD => {
        const mappedOwnerId = ownerIdMap[newD.ownerId] || newD.ownerId;
        const existing = DB.dogs.find(d =>
          d.ownerId === mappedOwnerId &&
          normName(d.name) === normName(newD.name)
        );
        if (existing) {
          // Fill in any blanks on the existing dog from the incoming data
          Object.keys(newD).forEach(k => {
            if (k === 'id' || k === 'ownerId') return;
            if (!existing[k] && newD[k]) existing[k] = newD[k];
          });
          mergedDogs++;
        } else {
          DB.dogs.push({ ...newD, ownerId: mappedOwnerId });
          addedDogs++;
        }
      });

      // Remap booking dogIds via dog name lookup (the new dog ids may not survive merging)
      const dogIdMap = {};
      data.dogs.forEach(newD => {
        const mappedOwnerId = ownerIdMap[newD.ownerId] || newD.ownerId;
        const found = DB.dogs.find(d =>
          d.ownerId === mappedOwnerId &&
          normName(d.name) === normName(newD.name)
        );
        if (found) dogIdMap[newD.id] = found.id;
      });

      data.bookings.forEach(newB => {
        const mappedDogId = dogIdMap[newB.dogId] || newB.dogId;
        const exists = DB.bookings.find(b =>
          b.dogId === mappedDogId &&
          b.date === newB.date &&
          (b.session || 'full') === (newB.session || 'full')
        );
        if (exists) {
          skippedBookings++;
        } else {
          DB.bookings.push({ ...newB, dogId: mappedDogId });
          addedBookings++;
        }
      });

      save(DB); render();
      alert(
        `Merge complete:\n\n` +
        `Clients:  +${addedOwners} new, ${mergedOwners} merged\n` +
        `Dogs:     +${addedDogs} new, ${mergedDogs} merged\n` +
        `Bookings: +${addedBookings} new, ${skippedBookings} duplicates skipped`
      );
    } catch (err) {
      console.error(err);
      alert('Invalid backup file.');
    }
  };
  reader.readAsText(file);
}

async function clearAllData() {
  const ok = confirm('Delete ALL data from BOTH this device AND the cloud? This cannot be undone.');
  if (!ok) return;
  const ok2 = confirm('Really sure? All clients, dogs, bookings will be lost.');
  if (!ok2) return;
  try {
    await setDoc(STATE_DOC, {
      owners: [], dogs: [], bookings: [],
      meta: { version: 1, createdAt: new Date().toISOString(), capacity: { maxDaycare: 5, maxBoarding: 3 } },
      _updatedAt: new Date().toISOString(),
      _updatedBy: fbAuth.currentUser?.email || 'unknown'
    });
  } catch (err) {
    console.error('Failed to clear Firestore:', err);
  }
  localStorage.removeItem(STORAGE_KEY);
  location.reload();
}
